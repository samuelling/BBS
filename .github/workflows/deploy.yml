name: Deploy board

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy-board

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Board not deployed. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install wrangler
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      - name: Make sure the database and file bucket exist
        if: steps.secrets.outputs.ready == 'true'
        run: node scripts/provision.mjs

      - name: Apply database migrations
        if: steps.secrets.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply septic-tankz --remote

      - name: Deploy the Worker
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### The Septic Tankz is live" >> "$GITHUB_STEP_SUMMARY"
          echo "Dial in at **${URL}**" >> "$GITHUB_STEP_SUMMARY"
