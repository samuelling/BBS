.top { display: flex; justify-content: space-between; gap: 12px; color: var(--dim); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.top b { color: #c9bfa9; font-weight: normal; }

#bezel {

}

|        |07||08  |06^^^^^^^^^^^^^^|08 |06S|08 |06C|08 |06U|08 |06M|08 |06^^^^^^^^^^^^^^^^^^|08  |07||08         |", "|08  |        |07'|08                                             |07'|08         |", "|08  |    |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08   |03E|08 |03F|08 |03F|08 |03L|08 |03U|08 |03E|08 |03N|08 |03T|08   |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08         |", "|08  |                                                                |", "|08  |  |06##########|08  |06S|08 |06L|08 |06U|08 |06D|08 |06G|08 |06E|08  |06###############################|08      |", "|08  '----------------------------------------------------------------'"], "toilet": ["|07              ____________", "|07             |  |15SEPTIC|07    |      |08Thanks for calling", "|07             |__|15TANKZ|07____|      |15THE SEPTIC TANKZ", "|07               |      |", "|07          .----'------'----.        |08Remember: only flush", "|07         (                  )       |08what you've uploaded.", "|07          '.              .'", "|07            '----.  .----'          |11Call back soon.", "|07                 |  |", "|07               __|__|__"]};

// ---------------------------------------------------------------- dom
const $ = id => document.getElementById(id);

// ---------------------------------------------------------------- fit 80 columns
let charRatio = 0.5;
function measure() {

// ---------------------------------------------------------------- abortable session plumbing
class Hangup extends Error {}
class BoardError extends Error {}
const pending = new Set();

  return new Promise((res, rej) => {

}

// ---------------------------------------------------------------- terminal output
let Q = [], drainers = [], running = false, fast = false, lastT = 0;
let curNode = null, curCls = "", gen = 0, fg = 7, bg = 0;

function parse(str) {
  const ops = [];
  let buf = "";
  const flush = () => { if (buf) { ops.push({ text: buf, fg, bg }); buf = ""; } };
  for (let i = 0; i < str.length; i++) {

    if (ch === "|" && /\d\d/.test(str.substr(i + 1, 2))) {

// ---------------------------------------------------------------- the board connection
let token = null, myNode = 0, LINES = 1, TIME_MIN = 60, INFO = null;
let state = "offline", onlineAt = 0;
let S = null;             // session: { user, eliteOk, unread }
let curAct = "Logging in", sentAct = "";

function rawFetch(path, opts) {
  return track((res, rej, entry) => {
    const ctl = new AbortController();
    entry.cancel = () => ctl.abort();
    fetch(API + "/api/" + path, { method: "POST", signal: ctl.signal, ...opts }).then(res, rej);
  });
}
async function api(path, body) {
  let r, data;
  try {
    r = await rawFetch(path, { headers: { "content-type": "application/json", ...(token ? { "x-line": token } : {}) }, body: JSON.stringify(body || {}) });
  } catch (e) {
    if (e instanceof Hangup) throw e;
    throw new BoardError("Line noise. The board didn't answer.");
  }
  try { data = await r.json(); } catch (e) { throw new BoardError("Garbled response from the board (" + r.status + ")."); }
  if (data.carrier === false) { dropCarrier(data.error && data.error !== "NO CARRIER" ? "|12*** " + esc(data.error) : null); throw new Hangup(); }
  if (!r.ok) throw new BoardError(data.error || "The board said no (" + r.status + ").");
  return data;
}
function act(s) { curAct = s; beat(); }
let lastBeat = 0;
function beat(force) {
  if (state !== "online" || !token) return;
  const every = S && S.user && S.user.sysop ? 8000 : 20000;
  if (!force && curAct === sentAct && Date.now() - lastBeat < every) return;
  sentAct = curAct; lastBeat = Date.now();
  const tk = token;
  fetch(API + "/api/beat", { method: "POST", headers: { "content-type": "application/json", "x-line": tk }, body: JSON.stringify({ act: curAct }) })
    .then(r => r.json()).then(d => {
      if (d.carrier === false && token === tk) dropCarrier("|12*** The board hung up on you.");
      else if (typeof d.pages === "number") showPages(d.pages);
    }).catch(() => {});
}

let pagesShown = 0;
function showPages(n) {
  stPage.hidden = !n;
  if (n) stPage.textContent = "PAGE! " + n + " caller" + (n > 1 ? "s" : "") + " [!]";
  if (n > pagesShown && A.ready()) { for (let i = 0; i < 3; i++) A.tone([1200, 1600], i * 0.3, 0.15, 0.25); }

}
async function guard(fn) {
  try { await fn(); }

let flowId = 0;

async function dialer() {
  setMode("offline");
  while (true) {
    cls();
    const now = new Date();
    const stamp = String(now.getMonth() + 1).padStart(2, "0") + "/" + String(now.getDate()).padStart(2, "0") + "/" + String(now.getFullYear()).slice(-2) + "  " + hm(now.getTime());

    const head = "|15 Q-Slodem Dialing Directory: |14QSLODEM.FON";

      const txt = "  " + lpad(n, 2) + "  " + pad(name, 28) + " " + pad(num, 17) + "  " + pad(baud, 7) + " " + last;
      return hl ? blue("|00" + txt, 19) : blue("|07" + txt);
    };
    await out(
      blue(head + " ".repeat(Math.max(1, 79 - vis(head) - stamp.length)) + "|07" + stamp) +
      rule80 +
      blue("|11  ##  " + pad("Name", 28) + " " + pad("Number", 17) + "  " + pad("Baud", 7) + " Last call") +
      blue("|03  --  " + "-".repeat(28) + " " + "-".repeat(17) + "  " + "-".repeat(7) + " ---------") +
      entry(1, "The Septic Tankz", PHONE, MODEM.telnet ? "telnet" : MODEM.id, "today", true) +
      entry(2, "The Grease Trap", "[unlisted]", "2400", "06/12/96", false) +
      entry(3, "Mom's House (voice!)", "do not dial", "--", "never", false) +

      blue("|07  use you get a |12busy signal|07. Try again, or let auto-redial keep trying.") +
      rule80 +
      blue("|07 {D} Dial  {A} Auto-redial  {S} Modem: |15" + pad(MODEM.telnet ? "Ethernet" : MODEM.label, 9) + "|07 {L} Local console  {?} About") +
      rule80 +
      "\n|08 Command: |07"
    );
    const k = await readKey("DA?LS");
    if (k === "S") { await pickModem(); continue; }
    if (k === "?") { await about(); continue; }
    if (k === "L") { if (await localConsole()) return lobby(); continue; }
    if (k === "D") { if (await dial()) return board(); await anyKey("\n|08[|07press any key to return to the directory|08]"); continue; }

        const keyP = readKey(null); keyP.catch(() => {});
        const r = await Promise.race([sleep(20000).then(() => null), keyP]);

  await out("|15 Modem setup\n" + rule(8) + "|08 #  Modem                Era    Speed        3 MB download\n");
  for (let i = 0; i < MODEMS.length; i++) {
    const m = MODEMS[i];
    const secs = 3 * 1048576 / m.cps;
    const t = m.telnet ? "a blink" : secs >= 3600 ? (secs / 3600).toFixed(1) + " hours" : Math.round(secs / 60) + " min";
    await out((m === MODEM ? "|14" : "|07") + " {" + (i + 1) + "} " + pad(m.label, 20) + "|08" + lpad(m.year, 4) + "   " +
      pad(m.telnet ? "10 Mbit+" : m.cps.toLocaleString("en-US") + " cps", 12) + " |07" + t + (m === MODEM ? " |14<- current" : "") + "\n");
  }
  await out("\n|08 Slower modems print the screens and send files at their real speed. Tap the\n screen or press a key while text is scrolling to fast-forward.\n\n|07Pick a modem: |15");
  const k = await readKey("123456789", { enter: String(MODEMS.indexOf(MODEM) + 1) });
  MODEM = MODEMS[+k - 1];
  try { localStorage.setItem("tankz-modem", MODEM.id); } catch (e) {}
  paintSpeed();
}

  beat(true);
  return true;
}

async function dial() {
  setMode("dialing");
  outNow("\n");
  let result = null, failed = null, settled = false;
  const call = () => rawFetch("dial", { headers: { "content-type": "application/json" }, body: JSON.stringify({ modem: MODEM.id }) })
    .then(r => r.json()).then(d => { result = d; }).catch(e => { failed = e; }).finally(() => { settled = true; });
  if (MODEM.telnet) {
    await out("|07telnet tankz.septic.net\n|08Trying tankz.septic.net...\n");
    await call();
    if (!result || result.error) { await out("|12telnet: connect to host: Connection timed out\n"); setMode("offline"); state = "nodial"; return false; }
    if (result.busy) { await out("|12telnet: All " + result.lines + " node" + (result.lines > 1 ? "s are" : " is") + " busy. Connection refused.\n"); setMode("offline"); return false; }
    token = result.token; myNode = result.node; LINES = result.lines; TIME_MIN = result.timeMin;
    await out("|07Connected to tankz.septic.net.\nEscape character is '^]'.\n");
    CPS = MODEM.cps;
    setMode("online");
    await sleep(300);
    return true;
  }
  await out("|07ATZ\n"); await sleep(250);
  await out("|15OK\n"); await sleep(300);
  await out("|07ATDT" + PHONE + "\n");
  await A.dialTone();
  await A.dtmf(PHONE);
  call();
  let rings = 0;
  while ((rings < 2 || !settled) && rings < 6) { await A.ring(); rings++; }
  if (!result || result.error) {
    await out("|12NO DIALTONE\n|08The board isn't answering. It may not be installed yet, or the line is down.\n");
    setMode("offline"); state = "nodial";
    return false;
  }
  if (result.busy) {
    await out("|12BUSY\n");
    await A.busy();
    setMode("offline");
    return false;
  }
  token = result.token; myNode = result.node; LINES = result.lines; TIME_MIN = result.timeMin;
  if (myNode > 1) await out("|08(line " + (myNode - 1 === 1 ? "1 is" : "1-" + (myNode - 1) + " are") + " busy, rolling over to line " + myNode + ")\n");
  await A.handshake(MODEM.hs);
  await out("|15" + MODEM.connect + "\n");
  CPS = MODEM.cps;
  setMode("online");
  await sleep(400);
  return true;
}

// Shows rows a screenful at a time.

  for (let i = 0; ; i += per) {
    cls();
    await out(header + (rows.length ? rows.slice(i, i + per).join("\n") + "\n" : "|08 (nothing here yet)\n"));

    await out("\n|07More? {Y} Yes  {N} No |15");

  }

// CP437 for the upper half, so ANSI art from the era renders right.
const CP437 = "ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ";
function decodeBytes(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  catch (e) { let s = ""; for (const x of bytes) s += x < 128 ? String.fromCharCode(x) : CP437[x - 128]; return s; }
}
// Turn ANSI escape colors into pipe codes; drop everything else.
function ansiToPipes(text) {
  const map = [0, 4, 2, 6, 1, 5, 3, 7];
  let bold = false, f = 7, outS = "";
  const re = /\x1b\[([\d;]*)([A-Za-z])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    outS += text.slice(last, m.index).replace(/\|/g, "!").replace(/[{}]/g, ch => ch === "{" ? "(" : ")");
    last = re.lastIndex;
    const params = m[1] ? m[1].split(";").map(Number) : [0];
    if (m[2] === "m") {
      for (const p of params) {
        if (p === 0) { bold = false; f = 7; }
        else if (p === 1) bold = true;
        else if (p >= 30 && p <= 37) f = map[p - 30];
        else if (p >= 40 && p <= 47) outS += "|" + String(16 + map[p - 40]);
      }
      if (params.includes(0)) outS += "|16";
      outS += "|" + String((bold ? 8 : 0) + f).padStart(2, "0");
    } else if (m[2] === "C") outS += " ".repeat(Math.min(80, params[0] || 1));
  }
  outS += text.slice(last).replace(/\|/g, "!").replace(/[{}]/g, ch => ch === "{" ? "(" : ")");
  return outS.replace(/\x1a[\s\S]*$/, "").replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").replace(/\t/g, "    ");
}
async function viewFile(f) {

    let rest = l;
    do { lines.push(rest.slice(0, 80)); rest = rest.slice(80); } while (rest.length);
  }
  await pager("|15 " + f.filename + "\n" + rule(8), lines.map(l => "|07" + l + "|16"), 20);
}

function xferTime(bytes) {
  const secs = bytes / Math.min(CPS, MODEM.cps);
  if (secs < 60) return Math.max(1, Math.round(secs)) + " sec";
  if (secs < 3600) return Math.round(secs / 60) + " min";
  return (secs / 3600).toFixed(1) + " hours";
}
function drawBar(bar, pr, size, cps) {
  const n = Math.round(pr * 40);
  bar.textContent = " [" + "#".repeat(n) + ".".repeat(40 - n) + "] " + lpad(Math.round(pr * 100), 3) + "%  " + cps.toLocaleString("en-US") + " cps  " + K(pr * size) + "\n";
  scrollDown();
}
// Resolves with the file the caller picks (or null). The picker itself is opened by the keypress.
function waitForPick() {
  picker.value = "";
  return track((res, rej, entry) => {
    const done = v => { picker.onchange = null; picker.oncancel = null; res(v); };
    picker.onchange = () => done(picker.files && picker.files[0] || null);
    picker.oncancel = () => done(null);
    entry.cancel = () => { picker.onchange = null; picker.oncancel = null; };

}

  const bar = await outEl("f7");

  if (result.status !== 200) throw new BoardError(result.d.error || "Upload failed.");
  drawBar(bar, 1, file.size, Math.round(file.size / Math.max(0.1, (Date.now() - t0) / 1000)));
  if (result.d.pending)

  await anyKey();
}

      if (here === "field") {
        score += 50; if (inv.includes("ring")) score += 50;
        await out("\n|10*** You escaped the tank in " + moves + " moves. Score: " + score + " of 100. ***\n");
        if (!inv.includes("ring")) await out("|08Rumor has it something valuable sank to the bottom...\n");
        return anyKey();
      }
      continue;
    }
    if (verb === "look" || verb === "l") { await look(); continue; }
    if (verb === "inventory" || verb === "i" || verb === "inv") { await out("|07You carry: " + (inv.length ? inv.map(i => ITEMS[i]).join(", ") : "nothing. You're a duck.") + "\n"); continue; }
    if (verb === "take" || verb === "get") {
      const it = Object.keys(ITEMS).find(k => noun.includes(k));
      if (!it || !roomItems[here].includes(it)) { await out("|07You don't see that here.\n"); continue; }
      roomItems[here] = roomItems[here].filter(x => x !== it); inv.push(it);
      await out("|07Taken. " + (it === "wrench" ? "It's heavy. You ride a little lower in the water." : "Someone's going to be very happy. Or very embarrassed.") + "\n");
      continue;
    }
    if (verb === "drop") {
      const it = inv.find(k => noun.includes(k));
      if (!it) { await out("|07You don't have that.\n"); continue; }
      inv = inv.filter(x => x !== it); roomItems[here].push(it);
      await out("|07Dropped. " + (it === "wrench" ? "You feel buoyant again." : "") + "\n");
      continue;
    }
    if (verb === "help" || verb === "?") { await out("|07Commands: LOOK, N/S/E/W/UP/DOWN, TAKE <thing>, DROP <thing>, INVENTORY, QUIT\n"); continue; }
    if (verb === "quack") { await out("|07Quack. It echoes off the concrete.\n"); continue; }
    if (verb === "quit" || verb === "q") { await out("|07You give up and wait for the pump truck.\n"); await sleep(600); return; }
    await out("|07I don't know how to \"" + esc(verb) + "\".\n");
  }
}

// One screen for every kind of chat: lines arrive above your input line while you type.
async function chatRoom(room, title, opts = {}) {
  act(opts.act || "Teleconference");
  const hc = room === "pool" ? "|13" : opts.private ? "|12" : "|11";
  cls();
  await out(hc + " " + title + "\n" + rule(room === "pool" ? 5 : opts.private ? 4 : 3) +
    "|08 Type and press Enter to talk. |07/Q|08 leaves, |07/W|08 shows who's here. Pipe codes (|07!12|08) add color.\n\n");
  let lastId = 0, members = [], stopped = false, polling = false, misses = 0, timer = null;
  const tk = token;
  const show = m => {
    if (m.kind === "join") outNow("|08*** " + esc(m.handle) + " joined" + "|07\n");
    else if (m.kind === "leave") outNow("|08*** " + esc(m.handle) + " left" + "|07\n");
    else {
      const mine = S && m.handle === S.user.handle;
      outNow((mine ? "|14" : opts.private ? "|12" : "|11") + "<" + esc(m.handle) + "> |07" + uc(m.text) + "\n");
    }
  };
  const poll = async () => {
    if (token !== tk || state !== "online") { stopped = true; clearInterval(timer); }
    if (stopped || polling) return;
    polling = true;
    try {
      const r = await api("chat/poll", { room, after: lastId });
      if (stopped) return;
      for (const m of r.msgs) { if (m.id > lastId) { show(m); lastId = m.id; } }
      const before = members.join(",");
      members = r.members;
      if (opts.onMembers) opts.onMembers(members, before);
      misses = 0;
    } catch (e) { if (++misses === 3) outNow("|12*** Line noise. Chat messages may be delayed.|07\n"); }
    finally { polling = false; }
  };
  await poll();
  if (!lastId) outNow("|08 (quiet in here)|07\n");
  outNow("|08 Here now: |07" + members.map(esc).join(", ") + "\n");
  timer = setInterval(poll, 1500);
  try {
    while (true) {
      const text = (await readLine({ max: 200, prompt: "> ", noEcho: true })).trim();
      if (!text) continue;
      if (/^\/(q|quit|x|exit)$/i.test(text)) break;
      if (/^\/(w|who)$/i.test(text)) { outNow("|08*** Here now: |07" + members.map(esc).join(", ") + "\n"); continue; }
      try { await api("chat/say", { room, text }); }
      catch (e) { if (e instanceof BoardError) outNow("|12*** " + esc(e.message) + "|07\n"); else throw e; }
      poll();
    }
  } finally {
    stopped = true; clearInterval(timer);
  }
  try { await api("chat/leave"); } catch (e) { if (e instanceof Hangup) throw e; }
}
