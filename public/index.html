  }
  async function trekPlay() {
    const g = trekNew();
    enterQuadrant(g);
    cls();
    await out("|15 Your orders are as follows:\n|07 Destroy the |12" + g.k0 + "|07 Grelk warships which have invaded Patrol space\n before stardate |15" +
      fx(g.t0 + g.limit) + "|07. That gives you |15" + g.limit + "|07 stardates.\n There " + (basesLeft(g) === 1 ? "is |15" + 1 + "|07 Patrol outpost" : "are |15" + basesLeft(g) + "|07 Patrol outposts") + " in the galaxy for resupplying your ship.\n");
    await out("\n|07 Your mission begins with your patrol ship in quadrant |15" + qname(g.qx, g.qy) + "|07.\n");
    if (g.foes.length) await out("|12 COMBAT AREA      CONDITION RED\n|12    SHIELDS DANGEROUSLY LOW\n");
    await trekSRS(g);
    while (!g.over) {
      if (g.energy + g.shields < 10 || (g.energy < 10 && g.dmg[SHIELDS] < 0)) { g.over = "stranded"; break; }
      await out("\n|07 {N} Navigate  {S} Short scan  {L} Long scan  {P} Phasers  {T} Torpedo\n" +
        "|07 {H} Shields  {D} Damage  {C} Computer  {?} Help  {Q} Resign  |14Command? |15");

      await out("\n");
      if (k === "N") await trekNav(g);
      else if (k === "S") await trekSRS(g);
      else if (k === "L") await trekLRS(g);
      else if (k === "P") await trekPhasers(g);
      else if (k === "T") await trekTorpedo(g);
      else if (k === "H") await trekShields(g);
      else if (k === "D") await trekDamage(g);
      else if (k === "C") await trekComputer(g);
      else if (k === "?") { await trekHelp(); await trekSRS(g); }
      else if (k === "Q") {
        await out("|07 Resign your command? |15{Y}|07/|15{N} ");
        if (await readKey("YN") === "Y") g.over = "resigned";
        await out("\n");
      }
    }
    // How it ended.
    await out("\n");
    const left = foesLeft(g);
    if (g.over === "won") {
      const rating = Math.round(1000 * (g.k0 / Math.max(0.1, g.t - g.t0)) ** 2);
      await out("|10 CONGRATULATIONS, CAPTAIN! The last Grelk battle cruiser menacing Patrol space\n has been destroyed.\n|15 Your efficiency rating is " + rating + ".\n");
      for (let i = 0; i < 5; i++) beep(392 * [1, 1.26, 1.5, 2, 1.5][i], 0.18, i * 0.18);
      await doorScore("trek", rating, g.k0 + " Grelk in " + fx(g.t - g.t0) + " stardates");
      return;
    }
    if (g.over === "destroyed") await out("|12 The Plunger has been destroyed. The Patrol will be conquered.\n");
    else if (g.over === "time") await out("|12 It is stardate " + fx(g.t) + ". Time's up. The Grelk overrun Patrol space.\n");
    else if (g.over === "stranded") await out("|12 ** FATAL ERROR ** You've just stranded your ship in space. You don't have\n enough energy to maneuver, and shield control can't help.\n");
    else if (g.over === "resigned") await out("|14 You resign your command.\n");
    await out("|15 " + left + "|07 Grelk battle cruisers were left when your mission ended. You got |15" + g.kills + "|07.\n");
    if (g.over === "destroyed" && A.ready()) A.noise(0, 1.5, 150, 0.6, 0.6);

  DOOR.trek = async function () {

    await out("|08                    ,-----.\n|07          ____    _/ |15<O>|07 \\_____\n|07        <|15====|07>==|08(_________)|07=====>   |14the patrol ship PLUNGER\n|08                     `---'\n");
    await out("|07 {I} Orders & instructions  {P} Play  {Q} Quit |15");

// ---- web/doors/reddrain.js
// Legend of the Red Drain: the shared-world forest RPG. The board server runs the game
// (worker/doors/reddrain.js); this file only draws the screens and sends your choices.
(() => {
  const TITLE = [
    "______         _  ______           _",
    "| ___ \\       | | |  _  \\         (_)",
    "| |_/ /___  __| | | | | |_ __ __ _ _ _ __",
    "|    // _ \\/ _` | | | | | '__/ _` | | '_ \\",
    "| |\\ \\  __/ (_| | | |/ /| | | (_| | | | | |",
    "\\_| \\_\\___|\\__,_| |___/ |_|  \\__,_|_|_| |_|",
  ];
  const SWIRL = [
    "   .-======-.",
    " .'  .-==-.  '.",
    "/  .' .--. '.  \\",
    "| |  ( () )  | |",
    "\\  '. '--' .'  /",
    " '.  '-..-'  .'",
    "   '-.____.-'",
  ];
  const SHADES = [12, 12, 4, 4, 4, 8];

  let T = null, P = null;   // static tables from the server, and you
  const call = async (action, body) => {
    const r = await api("door/reddrain/" + action, body);
    if (r.player) P = r.player;
    return r;
  };
  const num = n => Number(n || 0).toLocaleString("en-US");
  // Word wrap that ignores |NN color codes when measuring, with a hanging indent.
  function wrapc(str, width = 78, indent = "") {
    return String(str).split("\n").map(par => {
      const lead = par.match(/^ */)[0], words = par.slice(lead.length).split(" "), outl = [];
      let line = lead, len = lead.length, first = true;
      for (const w of words) {
        const wl = w.replace(/\|\d\d/g, "").length;
        if (!first && len + 1 + wl > width) { outl.push(line); line = indent + w; len = indent.length + wl; }
        else { line += (first ? "" : " ") + w; len += (first ? 0 : 1) + wl; }
        first = false;
      }
      outl.push(line);
      return outl.join("\n");
    }).join("\n");
  }
  const say = async (s, indent) => { await out(wrapc(s, 78, indent || "") + "|07\n"); };
  const lines = async (arr, indent) => { for (const l of arr) await out(wrapc(l, 78, indent || " ") + "|07\n"); };
  function bar() {
    const hpc = P.hp < P.maxhp / 3 ? "|12" : P.hp < P.maxhp ? "|14" : "|10";
    return "|08 HP " + hpc + num(P.hp) + "|08/|07" + num(P.maxhp) + "|08  Fights |15" + P.fights +
      "|08  Gold |14" + num(P.gold) + "|08  Bank |06" + num(P.bank) + "|08  Level |15" + P.level +
      "|08  XP |11" + num(P.xp) + (P.alive ? "" : "  |12DEAD") + "|07\n";
  }

  async function title() {
    cls();
    await out("\n|08" + " ".repeat(10) + "- = [ |14L E G E N D   O F   T H E|08 ] = -\n");
    for (let i = 0; i < SWIRL.length; i++) {
      const left = i < TITLE.length ? "|" + String(SHADES[i]).padStart(2, "0") + TITLE[i] : "";
      const vis = i < TITLE.length ? TITLE[i].length : 0;
      await out(" " + left + " ".repeat(Math.max(1, 48 - vis)) + (i % 2 ? "|04" : "|12") + SWIRL[i] + "\n");
    }
    await out("\n|07   A game of plumbing, peril and poor decisions.   |08One world, everyone in it.\n" +
      "|08   Door by The SysOp for MEGAzine BBS.\n\n");
  }

  async function notices(rows) {
    if (!rows || !rows.length) return;
    await out("\n|14 While you were away...\n" + rule(6));
    for (const n of rows) await say(" |08" + lpad(hm(n.at), 7) + "|07 " + n.text, " ".repeat(10));

  async function create() {

    await out("|12 A new arrival in Flushing\n" + rule(4));

      "|07The bus drops you at the edge of Flushing, a town built on top of the biggest",

    await anyKey();
    return true;
  }

  // ------------------------------------------------------------------ fighting
  async function fight(intro) {
    if (intro) await out("\n" + intro + "\n");

      const f = P.fight;
      await out("\n|08 " + esc(f.name.charAt(0).toUpperCase() + f.name.slice(1)) + "'s HP: |12" + num(f.hp) + "|08   Your HP: |10" + num(P.hp) + "|08/|07" + num(P.maxhp) + "\n" +

    return null;
  }

    while (true) {
      act("Red Drain: the Leach Field");
      cls();
      await out("|10 The Leach Field\n" + rule(2) + bar() + rule(8));

      await out("\n|07  {L} Look for something to kill\n  {H} Hilda's Healing Hut\n" +
        (P.dragonOk ? "  {D} |12Descend into the Red Drain|07\n" : "") +
        "  {R} Return to town\n\n|08 The Field (L,H," + (P.dragonOk ? "D," : "") + "R): |07");

        await lines(["|12 The Red Drain", rule(4).trim(),
          "|07You climb down an iron ladder into a chamber of rust and red water. It is warm.",
          "|07The water bulges. Something enormous lifts its head out of the drain, steaming,",
          "|07and looks at you with an eye the size of a manhole cover.", ""]);
        await out("|07 {F} Fight the Red Drain Dragon   {R} Run back up the ladder\n|08 Choose: |07");
        if (await readKey("FR") === "R") continue;
        try { await call("dragon"); }
        catch (e) { if (e instanceof BoardError) { await say("\n|12" + e.message); await anyKey(); continue; } throw e; }
        await fight("|12**THE RED DRAIN DRAGON ATTACKS!**|07");

      }

  async function training() {
    act("Red Drain: training");
    cls();
    await out("|15 The Training Hall\n" + rule(7));
    const m = T.masters[P.level];
    await say("|07Rows of dented plungers line the walls. Your master, |15" + m + "|07, is here.");
    await out("\n|07 {Q} Question your master   {F} Fight your master   {R} Return to town\n|08 Choose: |07");
    const k = await readKey("QFR");
    if (k === "R") return;
    const r = await call("master", {});
    if (r.say) { await say("\n" + r.say); await anyKey(); return; }
    if (k === "Q") { await say("\n|15" + m + "|07: \"You're ready. Pick up a plunger whenever you like.\""); await anyKey(); return; }
    await say("\n|15" + m + "|07: \"" + r.greet + "\"");
    await call("master", { fight: true });
    await fight("|14**You square off against " + m + "!**|07");
  }

  async function inn() {
    act("Red Drain: the inn");
    cls();
    await out("|03 The Overflow Inn\n" + rule(3));
    await say("|07A fire crackles. The barkeep is polishing a mug with a rag you hope is new. \"A room's |14" + num(20 * P.level) + "|07 gold. Nobody gets at you upstairs. Sleep in the field and anyone could.\"");
    await out("\n|07 {G} Get a room for the night (and leave the game)   {R} Return to town\n|08 Choose: |07");
    if (await readKey("GR") === "R") return false;
    try { await call("inn"); }
    catch (e) { if (e instanceof BoardError) { await say("\n|12" + e.message); await anyKey(); return false; } throw e; }
    await say("\n|07You climb the stairs, lock the door, and fall asleep on a mattress that crunches. |10You're safe until you return.");

    return true;
  }

  async function slaughter() {
    act("Red Drain: hunting players");
    cls();
    await out("|12 Slaughter a Sleeper\n" + rule(4));
    const r = await call("targets");
    await say("|07Some warriors sleep out in the Leach Field instead of paying for the inn. You can pick a fight with |15" + r.pfights + "|07 more today.");
    if (!r.rows.length) { await say("\n|08Nobody's sleeping in the field who's worth your time (within 2 levels of you, offline, not at the inn)."); await anyKey(); return; }
    await out("\n|08     " + pad("Warrior", 22) + pad("Class", 16) + "Level\n");
    const rows = r.rows.slice(0, 9);
    for (const [i, x] of rows.entries())
      await out("|07 {" + (i + 1) + "} |15" + pad(esc(x.handle), 22) + "|07" + pad(x.clsName, 16) + lpad(x.level, 5) + (x.wins ? " |12" + "*".repeat(Math.min(5, x.wins)) : "") + "\n");
    await out("\n|07 {Q} Leave them be\n|08 Attack who? |07");
    const k = await readKey("123456789".slice(0, rows.length) + "Q");
    if (k === "Q") return;
    const t = rows[+k - 1];
    if (!P.alive) return;
    try {
      const res = await call("pvp", { id: t.id });
      cls(); await out("|12 Murder in the Leach Field\n" + rule(4));
      await lines(res.log.map(l => " " + l));
    } catch (e) { if (e instanceof BoardError) await say("\n|12" + e.message); else throw e; }
    await anyKey();
  }

  async function newsScreen() {
    act("Red Drain: reading the news");
    cls();
    await out("|14 Daily Happenings in Flushing\n" + rule(6));
    const r = await call("news");
    if (!r.rows.length) await say("|08Nothing's happened yet. Give it time.");
    let day = null, n = 0;
    for (const row of r.rows) {
      if (n >= 17) break;
      if (row.day !== day) { day = row.day; await out("|03 " + (day === r.today ? "Today" : day) + "\n"); n++; }
      await say("|08  " + lpad(hm(row.at), 7) + " |07" + row.text, " ".repeat(11)); n += row.text.length > 60 ? 2 : 1;
    }
    await anyKey();
  }

  async function warriors() {
    act("Red Drain: list of warriors");
    cls();
    await out("|11 Warriors of Flushing\n" + rule(3));
    const r = await call("players");
    await out("|08 " + pad("#", 4) + pad("Warrior", 22) + pad("Class", 16) + lpad("Level", 6) + lpad("Experience", 13) + lpad("Kills", 7) + "  Dragons\n");
    for (const [i, x] of r.rows.slice(0, 15).entries())
      await out((x.alive ? "|07 " : "|08 ") + pad(i + 1, 4) + (x.alive ? "|15" : "|08") + pad(esc(x.handle), 22) + (x.alive ? "|07" : "|08") + pad(x.clsName, 16) + lpad(x.level, 6) +
        lpad(num(x.xp), 13) + lpad(x.kills, 7) + "  " + (x.wins ? "|12" + "*".repeat(Math.min(8, x.wins)) + (x.wins > 8 ? "+" : "") : "|08-") + (x.alive ? "" : " |08(dead)") + "\n");
    await anyKey();
  }

  async function stats() {
    cls();
    await out("|15 " + esc(P.handle) + "|08, level |15" + P.level + " " + P.clsName + "\n" + rule(8));
    const row = (a, b, c, d) => out("|08 " + pad(a, 16) + "|15" + pad(b, 24) + "|08" + pad(c, 16) + "|15" + d + "\n");
    await row("Hit points", num(P.hp) + " of " + num(P.maxhp), "Experience", num(P.xp));
    await row("Strength", num(P.str), "Next level at", P.level === 12 && P.dragonOk ? "the Dragon" : num(P.xpNeed));
    await row("Defense", num(P.def), "Gold on hand", num(P.gold));
    await row("Weapon", P.weaponName, "Gold in bank", num(P.bank));
    await row("Armor", P.armorName, "Forest fights", P.fights + " left");
    await row("Attack total", num(P.attack), "Player fights", P.pfights + " left");
    await row("Armor total", num(P.armorTotal), P.skill, P.skills + " left");
    await row("Players killed", P.kills, "Dragons slain", P.wins);
    await row("Days in town", P.days, "Status", P.alive ? "alive" : "dead until tomorrow");
    await anyKey();
  }

  async function town() {
    while (true) {
      act("Playing Legend of the Red Drain");
      await call("me");
      cls();
      await out("|12 Flushing|08, town square" + " ".repeat(40) + "day " + P.days + "\n" + rule(4) + bar() + rule(8));
      await say("|07The town square smells like a rest stop in August. Townsfolk hurry past. A fountain gurgles in a way fountains shouldn't.");
      await out("\n" +
        "|07  {F} The Leach Field          {K} Clem's Weapons\n" +
        "|07  {A} Ashbury's Armor          {H} Hilda's Healing Hut\n" +
        "|07  {T} The Training Hall        {B} Ye Olde Septic Bank\n" +
        "|07  {I} The Overflow Inn         {S} Slaughter a sleeper\n" +
        "|07  {N} Daily Happenings         {L} List of warriors\n" +
        "|07  {V} Your stats               {Q} Quit to the board\n" +
        "\n|08 Your command: |07");
      const k = await readKey("FKAHTBISNLVQ");
      try {
        if (k === "F") await forest();
        else if (k === "K") await shop("weapon");
        else if (k === "A") await shop("armor");
        else if (k === "H") await healer();
        else if (k === "T") { if (!P.alive) { await say("\n|12The dead don't train."); await anyKey(); } else await training(); }
        else if (k === "B") await bank();
        else if (k === "I") { if (!P.alive) { await say("\n|12The innkeeper doesn't rent to ghosts."); await anyKey(); } else if (await inn()) return; }
        else if (k === "S") { if (!P.alive) { await say("\n|12You're dead. Haunting doesn't count."); await anyKey(); } else await slaughter(); }
        else if (k === "N") await newsScreen();
        else if (k === "L") await warriors();
        else if (k === "V") await stats();
        else if (k === "Q") {
          await say("\n|07You wander off and bed down in the Leach Field. |12Anyone could find you there.");
          await sleep(900);
          return;
        }
      } catch (e) {
        if (!(e instanceof BoardError)) throw e;
        await say("\n|12" + e.message); await anyKey();
      }
    }
  }

  DOOR.reddrain = async function () {
    const st = await call("status");
    T = st;
    await title();
    await anyKey();
    await notices(st.notices);
    if (!st.player && !(await create())) return;
    if (P.fight) { cls(); await out("|14You're right where you left off: in a fight!|07\n"); await fight(null); }
    await town();
  };
})();


// ---- web/doors/tradewipes.js
// Trade Wipes 2002 — shared-universe space trading. The universe and every rule live on the
// board (worker/doors/tradewipes.js); this file just draws it and asks questions.
DOOR.tradewipes = async function () {
  const GOODS = ["Paper", "Soap", "Plungers"];
  const TITLE = [
    String.raw`  ______               __        _       ___`,
    String.raw` /_  __/________ _____/ /__     | |     / (_)___  ___  _____`,
    String.raw`  / / / ___/ __ ${"`"}/ __  / _ \    | | /| / / / __ \/ _ \/ ___/`,
    String.raw` / / / /  / /_/ / /_/ /  __/    | |/ |/ / / /_/ /  __(__  )`,
    String.raw`/_/ /_/   \__,_/\__,_/\___/     |__/|__/_/ .___/\___/____/`,
    String.raw`                                        /_/`,
  ];
  const SHIPART = [
    String.raw`|08    .        *          .        .        *       .         .`,
    String.raw`|07            __________________________`,
    String.raw`|07       ____/  |15o   o   o   o   o   o|07   \____               |08*`,
    String.raw`|07      |  |12TP-2002|07                           ||14>==-  -   -`,
    String.raw`|07       \___________________________________/|08          .`,
    String.raw`|08  *          .         .                .        *`,
  ];
  const n = x => Math.round(x).toLocaleString("en-US");
  const tw = (a, b) => api("door/tradewipes/" + a, b || {});
  let ME = null, V = null, DOCK = 0;

  // Board errors ("out of turns", "no warp there") are part of play: show them and carry on.
  async function attempt(fn) {
    try { return await fn(); }
    catch (e) {
      if (e instanceof BoardError) { await out("\n|12" + esc(e.message) + "|07\n"); return null; }
      throw e;
    }
  }
  // A blank answer means the default; prefill puts it in the edit line instead (for typed-ahead digits).
  async function ask(prompt, def, max = 9, prefill = false) {
    await out(prompt);
    const s = (await readLine({ max, value: prefill ? String(def) : "" })).trim();
    return s || (prefill || def === undefined || def === null ? s : String(def));
  }
  async function yn(q) {
    await out(q + " |08({Y}/{N})|07 ");
    const k = await readKey("YN", { enter: "N" });
    await out(k === "Y" ? "Yes\n" : "No\n");
    return k === "Y";
  }
  const num = s => { const v = parseInt(String(s).replace(/,/g, ""), 10); return Number.isFinite(v) ? v : NaN; };

  // ---------------------------------------------------------------- title and entry
  cls();
  await out(TITLE.map((l, i) => (i < 3 ? "|11" : "|03") + l).join("\n") + "\n");
  await out("|14" + " ".repeat(46) + "2 0 0 2\n");
  await out(SHIPART.join("\n") + "\n");
  await out("|08 An original game of trade, toilets and treachery in a universe of 300 sectors.\n");
  const e = await tw("enter");
  ME = e.me; V = e.view; DOCK = e.dock;
  if (e.isNew) {
    await out("\n|10 The Flush Federation issues you a |15" + esc(ME.ship) + "|10, " + ME.holds + " cargo holds, " + ME.fighters + " fighters\n" +
      " and " + n(ME.credits) + " credits. Buy " + GOODS.join(", ") + " where they're cheap, sell them where\n" +
      " they're not. The shipyard is in sector " + DOCK + ". Federation space (sectors 1-10) is safe;\n" +
      " beyond it, anyone can jump a parked ship.|07\n");
  } else {
    await out("\n|07 Welcome back, |14" + esc(ME.handle) + "|07. |11" + ME.turns + "|07 turns left today.\n");
  }
  if (e.away && e.away.length) {
    await out("\n|15 While you were away...\n");
    for (const x of e.away) await out("|08 " + d8(x.at) + " |07" + uc(x.text) + "\n");
  }
  await anyKey();

  // ---------------------------------------------------------------- the sector display
  async function showSector() {
    const v = V;
    let s = "\n|10Sector  |14: |11" + v.sector + " |02in |10" + esc(v.region) + (v.fed ? " |08(Federation space: no combat)" : "") + "\n";
    if (v.home) s += "|10Beacon  |14: |15Flush Federation HQ. Please wash your hands.\n";
    if (v.dock) s += "|10Port    |14: |15Porcelain Dock|07, the shipyard |08(press P)\n";
    if (v.port) s += "|10Port    |14: |11" + esc(v.port.name) + "|02, Class |14" + v.port.class + " |02(|13" + v.port.pattern + "|02)\n";
    if (v.planets.length) s += v.planets.map((p, i) => (i ? "          " : "|10Planets |14: ") + "|15" + esc(p.name) + "|02, owned by |14" + (p.mine ? "you" : esc(p.owner))).join("\n") + "\n";
    if (v.traders.length) s += v.traders.map((t, i) => (i ? "          " : "|10Traders |14: ") + "|14" + esc(t.handle) + "|02, w/ |11" + n(t.fighters) + "|02 ftrs in a |15" + esc(t.ship) + (t.online ? " |10(flying)" : " |08(parked)")).join("\n") + "\n";
    if (v.fighters) s += "|10Fighters|14: |11" + n(v.fighters.count) + " |02(" + (v.fighters.mine ? "yours, defensive" : "belonging to |14" + esc(v.fighters.owner) + "|02") + ")\n";
    s += "|10Warps to Sector(s) |14: " + v.warps.map(w => w.seen ? "|11" + w.s : "|08(|11" + w.s + "|08)").join(" |02- ") + "\n";
    await out(s);
  }
  const menuBar = "|08{M}|07ove {P}|07ort {C}|07omputer {F}|07ighters {A}|07ttack {L}|07and {I}|07nfo {Q}|07uit";
  async function prompt() {
    await out("\n|05Command |08[|14TL=" + ME.turns + "|08]|07:|08[|11" + V.sector + "|08] |07(?=Help)? : ");
    return readKey("MPCFALIQD?0123456789");
  }

  // ---------------------------------------------------------------- moving
  async function warpTo(dest) {
    const to = num(dest);
    if (!(to >= 1 && to <= 300)) { await out("|12Sectors run from 1 to 300.\n"); return; }
    if (to === V.sector) { await out("|07You're already in sector " + to + ".\n"); return; }
    if (V.warps.some(w => w.s === to)) {
      const r = await attempt(() => tw("move", { to }));
      if (!r) return;
      ME = r.me; V = r.view;
      await out("|08<|07Warping to sector " + to + "|08>\n");
      for (const ev of r.events) await out(uc(ev) + "\n");
      await showSector();
      return;
    }
    const p = await attempt(() => tw("plot", { to }));
    if (!p) return;
    await out("|07That sector isn't adjacent. The computer plots |14" + (p.path.length - 1) + "|07 hops, |14" + p.turns + "|07 turns:\n|11" +
      wrap(p.path.join(" > "), 76) + "\n");
    if (!(await yn("|07Engage the autopilot?"))) return;
    const r = await attempt(() => tw("auto", { to }));
    if (!r) return;
    ME = r.me; V = r.view;
    if (r.hops.length) await out("|08<|07Auto-warping: |11" + r.hops.join(" |08>|11 ") + "|08>\n");
    for (const ev of r.events) await out(uc(ev) + "\n");
    await showSector();
  }

  // ---------------------------------------------------------------- trading
  const QUIPS_COUNTER = ["Hmm. How about", "You drive a hard bargain. Fine:", "We could maybe do", "Our accountant weeps, but", "Let me flush that number. Try"];
  const QUIPS_REFUSE = ["We're not interested. Get out of my port!", "That's an insult to porcelain everywhere. Go away.", "Ha! Come back when you're serious.", "Security! Show this one out."];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  async function haggle(good, qty, mode) {
    const q = await attempt(() => tw("quote", { good, qty }));
    if (!q) return;
    let price = q.quote;
    await out("|02We'll " + (mode === "buy" ? "sell" : "buy") + " them for |14" + n(price) + "|02 credits.\n");
    while (true) {
      const s = await ask("|07Your offer |08[|14" + n(price) + "|08]|07 ? |15", "", 9);
      const offer = s ? num(s) : price;
      if (!(offer > 0)) { await out("|12A number, please.\n"); continue; }
      const r = await attempt(() => tw("offer", { price: offer }));
      if (!r) return;
      ME = r.me;
      if (r.result === "accept") {
        await out("|10Agreed, |14" + n(r.price) + "|10 credits. " + (mode === "buy" ? "We'll load them into your holds." : "Unloading your " + GOODS[good] + "...") + "\n");
        if (r.xp) await out("|11For your good trading you receive |14" + r.xp + "|11 experience point" + (r.xp > 1 ? "s" : "") + ".\n");
        await out("|07You have |14" + n(ME.credits) + "|07 credits and |14" + (ME.holds - ME.cargo.reduce((a, b) => a + b)) + "|07 empty holds.\n");
        return;
      }
      if (r.result === "refuse") { await out("|12" + pick(QUIPS_REFUSE) + "\n"); return; }
      price = r.price;
      await out("|02" + pick(QUIPS_COUNTER) + " |14" + n(price) + "|02?\n");
    }
  }
  async function trade() {
    if (V.dock) return shipyard();
    if (!V.port) { await out("|07There's no port in this sector.\n"); return; }
    const r = await attempt(() => tw("port"));
    if (!r) return;
    ME = r.me;
    const P = r.port;
    await out("\n|08Docking...\n|10Commerce report for |11" + esc(P.name) + "|10: " + d8(Date.now()) + " " + hm(Date.now()) + "\n\n" +
      "|02 Items      Status    Trading  % of max  OnBoard\n |08-----      ------    -------  --------  -------\n");
    for (const [i, it] of P.items.entries()) await out("|11 " + pad(it.good, 11) + (it.mode === "buying" ? "|10Buying  " : "|13Selling ") + "|14" + lpad(n(it.qty), 9) + lpad(it.pct + "%", 10) + "|11" + lpad(ME.cargo[i], 9) + "\n");
    await out("\n|07You have |14" + n(ME.credits) + "|07 credits and |14" + (ME.holds - ME.cargo.reduce((a, b) => a + b)) + "|07 empty cargo holds.\n");
    // Sell first, then buy, like the old ports did it.
    for (const pass of ["buying", "selling"]) {
      for (let i = 0; i < 3; i++) {
        const it = P.items[i];
        if (it.mode !== pass || !it.qty) continue;
        const free = ME.holds - ME.cargo.reduce((a, b) => a + b);
        if (pass === "buying") {
          if (!ME.cargo[i]) continue;
          const def = Math.min(ME.cargo[i], it.qty);
          await out("\n|02We are buying up to |14" + n(it.qty) + "|02. You have |14" + ME.cargo[i] + "|02 in your holds.\n");
          const s = await ask("|07How many holds of |11" + it.good + "|07 do you want to sell |08[|14" + def + "|08]|07? |15");
          const q = s === "" ? def : num(s);
          if (q > 0) await haggle(i, q, "sell");
        } else {
          if (!free) continue;
          const afford = Math.floor(ME.credits / Math.max(1, it.unit));
          const def = Math.max(0, Math.min(free, it.qty, afford));
          await out("\n|02We are selling up to |14" + n(it.qty) + "|02. You have |14" + free + "|02 empty holds.\n");
          const s = await ask("|07How many holds of |11" + it.good + "|07 do you want to buy |08[|14" + def + "|08]|07? |15");
          const q = s === "" ? def : num(s);
          if (q > 0) await haggle(i, q, "buy");
        }
      }
    }
    await out("\n|08You undock.\n");
  }

  // ---------------------------------------------------------------- the shipyard
  async function shipyard() {
    let r = await attempt(() => tw("yard"));
    if (!r) return;
    while (true) {
      ME = r.me; const Y = r.yard;
      cls();
      await out("|15 Porcelain Dock |08- shipyard of the Flush Federation, sector " + V.sector + "\n" + rule(8) +
        "|07 Ship |15" + esc(ME.ship) + "|07   Credits |14" + n(ME.credits) + "\n" +
        "|07 Holds |14" + ME.holds + "|08/" + ME.maxHolds + "|07   Fighters |14" + n(ME.fighters) + "|08/" + n(ME.maxF) +
        "|07   Shields |14" + n(ME.shields) + "|08/" + n(ME.maxS) + "|07   Torpedoes |14" + ME.torps + "\n\n" +
        "|07 {H} Cargo holds       |14" + lpad(n(Y.hold), 7) + "|07 each (price climbs as you add more)\n" +
        "|07 {F} Fighters          |14" + lpad(n(Y.fighter), 7) + "|07 each\n" +
        "|07 {S} Shield points     |14" + lpad(n(Y.shield), 7) + "|07 each\n" +
        "|07 {T} Flushbang torpedo |14" + lpad(n(Y.torp), 7) + "|07 makes a planet (you carry " + ME.torps + " of " + Y.maxTorps + ")\n" +
        "|07 {N} New ship\n|07 {Q} Leave the dock\n\n|08Your choice: |07");
      const k = await readKey("HFSTNQ");
      if (k === "Q") { cls(); await showSector(); return; }
      let res = null;
      if (k === "N") {
        await out("\n\n|02     Ship                     Holds  Max ftrs  Max shlds  T/W      Price\n");
        for (const s of Y.ships) await out((s.yours ? "|14" : "|07") + " " + (s.id ? "{" + s.id + "} " : "    ") + pad(s.name, 22) + lpad(s.baseHolds + "/" + s.maxHolds, 8) +
          lpad(n(s.maxF), 10) + lpad(n(s.maxS), 11) + lpad(s.tpw, 5) + lpad(s.yours ? "yours" : s.price === null ? "-" : n(s.price), 11) + "\n");
        await out("|08 Price includes trade-in. Fighters, shields and cargo carry over where they fit.\n|07Which ship? |08({Q} cancel)|07 ");
        const c = await readKey("123Q");
        if (c === "Q") continue;
        res = await attempt(() => tw("buy", { item: "ship", ship: +c }));
        if (res) await out("\n|10Sold! You take the keys to your new |15" + esc(res.bought) + "|10.\n");
      } else {
        const item = { H: "holds", F: "fighters", S: "shields", T: "torps" }[k];
        const s = await ask("\n\n|07How many " + { holds: "cargo holds", fighters: "fighters", shields: "shield points", torps: "torpedoes" }[item] + "? |15", "", 6);
        const q = num(s);
        if (!(q > 0)) continue;
        res = await attempt(() => tw("buy", { item, qty: q }));
        if (res) await out("|10Done. That's |14" + n(res.cost) + "|10 credits.\n");
      }
      if (res) r = res;
      await anyKey();
    }
  }

  // ---------------------------------------------------------------- the computer
  async function computer() {
    while (true) {
      await out("\n|15<Computer activated>\n|07 {P} Plot a course   {N} Nearest port for a commodity   {R} Port report\n" +
        "|07 {K} Rankings        {L} Daily log of the universe      {Q} Shut down\n|05Computer command|07? ");
      const k = await readKey("PNRKLQ");
      await out("\n");
      if (k === "Q") { await out("|08<Computer deactivated>\n"); return; }
      if (k === "P") {
        const to = num(await ask("|07Plot a course to which sector? |15", "", 3));
        if (!(to > 0)) continue;
        const p = await attempt(() => tw("plot", { to }));
        if (p) {
          await out("|07The shortest path is |14" + (p.path.length - 1) + "|07 hops, |14" + p.turns + "|07 turns:\n|11" + wrap(p.path.join(" > "), 76) + "\n");
          if (await yn("|07Engage the autopilot?")) { await warpTo(String(to)); return; }
        }
      }
      if (k === "N") {
        await out("|07Commodity: {1} Paper  {2} Soap  {3} Plungers ");
        const g = +(await readKey("123")) - 1;
        await out(GOODS[g] + "\n|07Find a port that will {B} sell it to you, or {S} buy it from you? ");
        const m = await readKey("BS");
        const r = await attempt(() => tw("nearest", { good: g, want: m === "S" ? "sell" : "buy" }));
        if (r) await out("\n|07Nearest: |11" + esc(r.port.name) + "|07 (|13" + r.port.pattern + "|07) in sector |14" + r.port.sector + "|07, " + (r.path.length - 1) + " hops:\n|11" + wrap(r.path.join(" > "), 76) + "\n");
      }
      if (k === "R") {
        const s = num(await ask("|07Port report for which sector? |15", "", 3));
        if (!(s > 0)) continue;
        const r = await attempt(() => tw("port/info", { sector: s }));
        if (r) {
          await out("|11" + esc(r.port.name) + "|07, sector " + r.port.sector + ", class " + r.port.class + " (|13" + r.port.pattern + "|07)\n");
          for (const it of r.port.items) await out("|07  " + pad(it.good, 10) + (it.mode === "buying" ? "|10buying  " : "|13selling ") + "|14" + lpad(n(it.qty), 7) + lpad(it.pct + "%", 6) + "|07  about |14" + it.unit + "|07 a unit\n");
        }
      }
      if (k === "K") await rankings();
      if (k === "L") await dailyLog();
    }
  }
  async function rankings() {
    const r = await attempt(() => tw("rank"));
    if (!r) return;
    await out("\n|15 Top traders by net worth\n|02  #  Trader                 Net worth  Ship                    Kills Planets\n");
    for (const [i, x] of r.rows.entries()) await out((x.you ? "|14" : "|07") + lpad(i + 1, 3) + "  " + pad(esc(x.handle), 20) + lpad(n(x.worth), 11) + "  " + pad(esc(x.ship), 22) + lpad(x.kills, 6) + lpad(x.planets, 8) + "\n");
  }
  async function dailyLog() {
    const r = await attempt(() => tw("news"));
    if (!r) return;
    await out("\n|15 The Trade Wipes Gazette\n");
    if (!r.rows.length) await out("|08 Nothing has happened yet. Make some news.\n");
    for (const x of r.rows.slice().reverse()) await out("|08 " + d8(x.at) + " " + hm(x.at) + " |07" + uc(x.text) + "\n");
  }

  // ---------------------------------------------------------------- fighters, attacks, planets
  async function fighters() {
    if (V.fed) { await out("|07The Federation doesn't allow fighters in its space.\n"); return; }
    if (V.fighters && !V.fighters.mine) { await out("|07" + esc(V.fighters.owner) + "'s fighters hold this sector. Clear them first.\n"); return; }
    const here = V.fighters && V.fighters.mine ? V.fighters.count : 0;
    await out("|07You have |14" + n(ME.fighters) + "|07 fighters aboard and |14" + n(here) + "|07 guarding this sector.\n");
    const s = await ask("|07How many fighters should guard this sector? |08[|14" + here + "|08]|07 |15", here, 6);
    const q = num(s);
    if (!(q >= 0)) return;
    const r = await attempt(() => tw("fighters", { leave: q }));
    if (!r) return;
    ME = r.me;
    const v = await tw("view"); V = v.view;
    await out(q ? "|10" + n(q) + " fighters take up positions. They'll greet anyone who drops by.\n" : "|07Your fighters come back aboard.\n");
  }
  async function attack() {
    if (V.fed) { await out("|07Combat in Federation space? The Feds would have your license.\n"); return; }
    const T = [];
    for (const t of V.traders) T.push({ kind: "ship", target: t.id, label: esc(t.handle) + "'s " + esc(t.ship) + " (" + n(t.fighters) + " ftrs" + (t.online ? ", flying" : ", parked") + ")" });
    if (V.fighters && !V.fighters.mine) T.push({ kind: "fighters", label: n(V.fighters.count) + " fighters belonging to " + esc(V.fighters.owner) });
    for (const p of V.planets) if (!p.mine) T.push({ kind: "planet", target: p.id, label: "the planet " + esc(p.name) + ", owned by " + esc(p.owner) });
    if (!T.length) { await out("|07Nothing here to attack.\n"); return; }
    if (!ME.fighters) { await out("|07You have no fighters to send. The shipyard sells them.\n"); return; }
    await out("|12Targets in sector " + V.sector + ":\n");
    for (const [i, t] of T.slice(0, 9).entries()) await out("|07 {" + (i + 1) + "} " + t.label + "\n");
    await out("|07 {Q} Never mind\n|12Attack which? |07");
    const k = await readKey("123456789".slice(0, Math.min(9, T.length)) + "Q");
    if (k === "Q") return;
    const t = T[+k - 1];
    const s = await ask("\n|07You have |14" + n(ME.fighters) + "|07 fighters. How many will you send? |08[|14" + ME.fighters + "|08]|07 |15", ME.fighters, 6);
    const send = num(s);
    if (!(send > 0)) return;
    await out("|12Launching fighters...\n");
    await sleep(600);
    const r = await attempt(() => tw("attack", { kind: t.kind, target: t.target, send }));
    if (!r) return;
    ME = r.me; V = r.view;
    for (const ev of r.events) await out(uc(ev) + "\n");
  }
  async function land() {
    const mine = V.planets;
    await out("|10Planets in sector " + V.sector + ":\n");
    if (!mine.length) await out("|08 none\n");
    for (const [i, p] of mine.slice(0, 3).entries()) await out("|07 {" + (i + 1) + "} |15" + esc(p.name) + "|07, owned by |14" + (p.mine ? "you" : esc(p.owner)) + "\n");
    if (ME.torps) await out("|07 {T} Launch a Flushbang torpedo here (you have " + ME.torps + ")\n");
    await out("|07 {Q} Never mind\n|10Your choice? |07");
    const k = await readKey("123".slice(0, mine.length) + (ME.torps ? "T" : "") + "Q");
    await out("\n");
    if (k === "Q") return;
    if (k === "T") {
      const name = await ask("|07Name your new planet: |15", "", 24);
      if (!name.trim()) return;
      const r = await attempt(() => tw("planet/create", { name }));
      if (!r) return;
      ME = r.me; V = r.view;
      await out("|14The torpedo spirals into the void... a gurgle... a burp... and |15" + esc(r.name) + "|14 bubbles into existence!\n" +
        "|07Two thousand colonists, who were promised a nicer place, start making goods.\n");
      return;
    }
    let r = await attempt(() => tw("planet/land", { id: mine[+k - 1].id }));
    while (r) {
      ME = r.me; const P = r.planet;
      await out("\n|15Planet " + esc(P.name) + "|07   Colonists |14" + n(P.colonists) + "|07   Fighters |14" + n(P.fighters) + "\n" +
        "|07Stockpiles: " + GOODS.map((g, i) => g + " |14" + n(P.goods[i]) + "|07").join("  ") + "   |08(makes " + n(P.make) + " of each a day)\n" +
        "|07 {T} Take goods aboard   {F} Set planet fighters   {Q} Lift off\n|10Planet command? |07");
      const c = await readKey("TFQ");
      await out("\n");
      if (c === "Q") { await out("|08You lift off.\n"); return; }
      if (c === "T") {
        const free = () => ME.holds - ME.cargo.reduce((a, b) => a + b);
        const take = [0, 0, 0];
        let room = free();
        for (let i = 0; i < 3; i++) {
          if (!P.goods[i] || !room) continue;
          const def = Math.min(P.goods[i], room);
          const q = num(await ask("|07Take how much |11" + GOODS[i] + "|07? |08[|14" + def + "|08]|07 |15", "", 6) || def);
          take[i] = Math.max(0, Math.min(q || 0, def)); room -= take[i];
        }
        r = await attempt(() => tw("planet/xfer", { id: P.id, take }));
      } else {
        const q = num(await ask("|07Fighters to station on the planet (" + n(ME.fighters) + " aboard)? |08[|14" + P.fighters + "|08]|07 |15", P.fighters, 6));
        if (!(q >= 0)) continue;
        r = await attempt(() => tw("planet/xfer", { id: P.id, leave: q }));
      }
    }
  }
  async function info() {
    const cargo = ME.cargo.reduce((a, b) => a + b);
    await out("\n|15Trader |14" + esc(ME.handle) + "|07   Experience |14" + n(ME.exp) + "|07   Net worth |14" + n(ME.worth) + "|07 credits\n" +
      "|07Ship  |15" + esc(ME.ship) + "|07   Turns left |14" + ME.turns + "|07 (" + ME.tpw + " per warp)   Credits |14" + n(ME.credits) + "\n" +
      "|07Holds |14" + ME.holds + "|08/" + ME.maxHolds + "|07: " + GOODS.map((g, i) => g + " |14" + ME.cargo[i] + "|07").join(", ") + ", empty |14" + (ME.holds - cargo) + "\n" +
      "|07Fighters |14" + n(ME.fighters) + "|08/" + n(ME.maxF) + "|07   Shields |14" + n(ME.shields) + "|08/" + n(ME.maxS) + "|07   Flushbang torpedoes |14" + ME.torps +
      "|07   Kills |14" + ME.kills + "|07   Deaths |14" + ME.deaths + "\n|07The shipyard is in sector |14" + DOCK + "|07.\n");
  }
  async function help() {
    await out("\n" + menuBar + "\n" +
      "|08 Type a sector number to warp there (the autopilot handles distant ones). Sectors in\n" +
      " (parentheses) are ones you haven't visited. Ports are classed by what they Buy and Sell:\n" +
      " BSS buys Paper, sells Soap and Plungers. Buy low, haggle, sell high. Fighters you leave\n" +
      " in a sector ambush anyone else who warps in. Ships parked outside Federation space can be\n" +
      " jumped while their owners are off-line, so park in sectors 1-10. {D} redraws this sector.\n");
  }
  async function quit() {
    if (!V.fed && !(await yn("|12You're outside Federation space, where parked ships get jumped. Quit anyway?"))) return false;
    await out("|07Your ship stays parked in sector |14" + V.sector + "|07. Come back tomorrow for |14250|07 fresh turns.\n");
    await sleep(900);
    return true;
  }

  // ---------------------------------------------------------------- main loop
  cls();
  await out(menuBar + "\n");
  await showSector();
  while (true) {
    const k = await prompt();
    if (/\d/.test(k)) {
      await out("\n");
      const s = await ask("|07Warp to sector: |15", k, 3, true);
      if (s) await warpTo(s);
      continue;
    }
    await out(k === "?" ? "Help\n" : "\n");
    if (k === "M") { const s = await ask("|07Warp to which sector? |15", "", 3); if (s) await warpTo(s); }
    else if (k === "D") await showSector();
    else if (k === "P") await trade();
    else if (k === "C") await computer();
    else if (k === "F") await fighters();
    else if (k === "A") await attack();
    else if (k === "L") await land();
    else if (k === "I") await info();
    else if (k === "?") await help();
    else if (k === "Q") { if (await quit()) return; }
  }
};

DOOR.usurper = async function () {
  const T = "|02", HI = "|10", TALK = "|03", PLY = "|11", MON = "|12", ITEM = "|13", GOLD = "|14", WHITE = "|15", HEAD = "|05", RED = "|12", MAG = "|13", DIM = "|08";
  const RACES = ["Human", "Hobbit", "Elf", "Half-Elf", "Dwarf", "Troll", "Orc", "Gnome", "Gnoll", "Mutant"];
  const RACE_ADJ = ["a humble", "a loyal", "a graceful", "an allround", "a stubborn", "a stinking", "an ill-mannered", "a willful", "a puny", "a weird"];
  const CLASSES = ["Alchemist", "Assassin", "Barbarian", "Bard", "Cleric", "Jester", "Magician", "Paladin", "Ranger", "Sage", "Warrior"];
  const CLASS_ADJ = ["a shy", "a hiding", "a powerful", "an entertaining", "a praying", "a foolish", "a secretive", "an honorable", "a fast", "a wise", "a brave"];
  const CLASS_KEYS = "1234567890W";
  const MASTERS = ["Akrappa", "Singuman", "Ishana", "Dzarrgo", "Agni", "Apollonia", "Sachmez", "Umilak", "Asanga", "Gregorius"];
  const MASTER_TITLES = ["The Wise", "Bearer of Light and Fire", "The Last Northern Princess", "The Ancient Stone Lord", "The Shadow Dweller",
    "last Pupil of Sagan, the Sage", "The Great and Evil Witchmaster", "The Demon Tamer", "The Mysterious", "The Patriarch"];
  const ROOMS = [0, 200, 900, 3200, 7500];
  const FLOOR_NAMES = ["", "Downstairs", "First floor", "Second floor", "Third floor"];
  const n = v => Math.round(v || 0).toLocaleString("en-US");
  const TC = "|11", KC = "|14", KIDC = "|10", RELC = "|06", GODC = "|10";
  const money = v => (v === 1 ? "gold coin" : "gold coins");
  let P = null;        // the character as the board last described it
  let G = null;        // the Immortal, in the Divine Realm
  let lastR = null;    // the board's last answer (fights hand over from one kind to the next)

  // Calls the game. Board refusals are printed and come back as null; a dropped carrier still hangs up.
  async function call(action, body) {
    try {
      const r = await api("door/usurper/" + action, body || {});
      lastR = r;
      if (r.p) P = r.p;
      if (r.out && r.out.length) await out(r.out.join("\n") + "\n|07");
      return r;
    } catch (e) {
      if (e instanceof BoardError) { lastR = null; await out("\n" + RED + esc(e.message) + "|07\n"); return null; }
      throw e;
    }
  }
  async function yn(q, def) {
    await out(T + q + " " + DIM + "(" + (def === "Y" ? "[Y]/N" : "Y/[N]") + ")" + T + " ");
    const k = await readKey("YN", { enter: def });
    outNow((k === "Y" ? HI + "Yes" : RED + "No") + "|07\n");
    return k === "Y";
  }
  async function num(prompt, def) {
    await out(T + prompt + (def !== undefined ? DIM + " [" + n(def) + "]" : "") + T + ": " + WHITE);
    const s = (await readLine({ max: 14 })).replace(/[, ]/g, "");
    if (s === "" && def !== undefined) return def;
    const v = parseInt(s, 10);
    return Number.isFinite(v) ? v : null;
  }
  const pause = () => anyKey("\n" + DIM + "[" + T + "press any key" + DIM + "]|07");
  function header(s) { return HEAD + " " + s + "\n " + HEAD + "-".repeat(s.length) + "|07\n"; }
  function cols(items, w = 26) {   // menu entries laid out three across, like Usurper's menu2
    let s = "", c = 0;
    for (const it of items) {
      const vis = it.replace(/\|\d\d/g, "").replace(/\{(.)\}/g, "[$1]").length;
      s += (c === 0 ? "  " : "") + it + " ".repeat(Math.max(1, w - vis));
      if (++c === 3) { s += "\n"; c = 0; }
    }
    return s + (c ? "\n" : "");
  }

  // ------------------------------------------------------------ title
  cls();
  const banner = [
    String.raw`   __  _______ __  ______  ____  __________ `,
    String.raw`  / / / / ___// / / / __ \/ __ \/ ____/ __ \ `,
    String.raw` / / / /\__ \/ / / / /_/ / /_/ / __/ / /_/ / `,
    String.raw`/ /_/ /___/ / /_/ / _, _/ ____/ /___/ _, _/ `,
    String.raw`\____//____/\____/_/ |_/_/   /_____/_/ |_| `,
  ];
  const shade = ["|15", "|12", "|12", "|04", "|04"];
  await out("\n" + banner.map((l, i) => shade[i] + " ".repeat(17) + l).join("\n") + "\n\n" +
    "|07            Gangwars and partying. Become king, or fall trying.\n" +
    "|07       Fight monsters and other players in this fascinating game.\n\n" +
    "|14  USURPER |07(c) 1993-2009 Jakob Dangarden. Ported by Rick Parrish,\n" +
    "|07  bug fixes by Dan Zingaro. Free software under the GNU GPL v2 or later.\n" +
    "|08  Converted for MEGAzine BBS: Main Street, dungeons, shops, inn, bank,\n" +
    "|08  Level Masters, player fights, gangs, gang wars, the Castle and the throne,\n" +
    "|08  the prison, bounties, royal quests, love and family, the Gods, the Gym,\n" +
    "|08  the Marketplace, brawls, wrestling and the news.\n");
  await pause();

  let r = await call("enter");
  if (!r) return;
  if (r.completed) { await afterLife(); return; }
  if (r.god) {   // USURPER.PAS: enter as a mortal or as an immortal
    cls();
    await out("\n" + HEAD + "Welcome back, " + GODC + esc(r.god) + "\n\n" + T + "{I}mmortal  - enter the Divine Realm\n" + T + (r.p ? "{M}ortal    - play " + PLY + esc(P.name) : "{N}ew       - create a new mortal character") + "\n" + T + "{Q}uit\n\n" + T + "Choice : ");
    const k = await readKey(r.p ? "IMQ" : "INQ");
    outNow("\n");
    if (k === "Q") return;
    if (k === "I") { await godWorld(); return; }
  }
  if (!r.p && !(await createCharacter())) return;
  if (r.mail && r.mail.length) await showMail(r.mail);
  if (r.requests && r.requests.length && await answerRequests(r.requests) === "dead") return;
  if (r.babies && r.babies.length) await nameBabies(r.babies);
  if (r.pregnant) { await out("\n" + WHITE + "YOU ARE PREGNANT!\n"); await pause(); }
  if (r.prison) { await prisonCell(); return; }
  if (r.kingNews) await out("\n" + "|14  " + esc(r.kingNews) + "\n");
  if (r.barred) {
    await out("\n" + RED + "Since your last visit ...\n\n" + T + "You may return tomorrow and regain some of your lost pride...\n");
    await pause();
    return;
  }
  if (r.p) {
    if (r.wasAt === 5) await out("\n" + T + "You wake up in the Royal bed. Servants help you into your robes.\n");
    else if (r.wasAt === 7) await out("\n" + T + "You wake up at the Beggars Wall, stiff and cold, and shuffle into town.\n");
    else if (r.wasAt === 8) await out("\n" + T + "You wake up in your own bed at home. Home sweet home.\n");
    else if (r.wasAt > 0) await out("\n" + T + "You wake up in your room at the Inn, well rested, and walk down to the street.\n");
    else await out("\n" + T + "You are awake. Sleeping here in the Dormitory isn't\n" + T + "too comfortable. You deserve better than this, you think\n" + T + "to yourself while you get dressed.\n");
    await pause();
  }
  await mainStreet();

  // ------------------------------------------------------------ creation (USERHUNC.PAS)
  async function createCharacter() {
    cls();
    await out("\n" + header("Introducing a new user") + "\n" + T + "Hello " + HEAD + esc(S.user.handle) + T + ", you must be a new user.\n\n" +
      T + "Dare you enter a dark world filled with evil ?\n\n" + T + "{Y}es, I'm brave and bold!\n" + T + "{N}o, I'm scared...\n\n" + T + "Choice : ");
    if ((await readKey("YN")) === "N") { await out("\n" + GOLD + "Goodbye, adventurer!\n"); await sleep(800); return false; }
    let sex = 0, race = -1, cls_ = -1;
    while (!sex) {
      await out("\n\n" + HI + "Gender :\n" + T + "{M}ale\n" + T + "{F}emale\n" + T + "Choice :");
      const k = await readKey("MF");
      outNow("\n");
      if (await yn(k === "M" ? "Play a Male character" : "Play a Female character", "N")) sex = k === "M" ? 1 : 2;
    }
    while (race < 0) {
      cls();
      await out("\n" + T + "Choose your Race\n\n" + RACES.map((x, i) => T + "{" + i + "} " + x + (i === 8 ? "|11 *poisonous bite" : "")).join("\n") + "\n\n" + T + "Your choice :");
      const k = await readKey("0123456789");
      outNow("\n");
      if (await yn("Be " + RACE_ADJ[+k] + " " + GOLD + RACES[+k] + T, "N")) race = +k;
    }
    while (cls_ < 0) {
      cls();
      const notes = { 0: "*poison", 1: "*backstabbing", 4: "*spells", 6: "*spells", 7: "*soulstrike", 9: "*spells" };
      await out("\n" + T + "Choose your Profession :   (* special ability)\n\n" +
        CLASSES.map((x, i) => T + "{" + CLASS_KEYS[i] + "} " + pad(x, 12) + "|11" + (notes[i] || "")).join("\n") + "\n\n" + T + "Your choice :");
      const k = await readKey(CLASS_KEYS);
      outNow("\n");
      const c = CLASS_KEYS.indexOf(k);
      if (!(await yn("Be " + CLASS_ADJ[c] + " " + GOLD + CLASSES[c] + T, "N"))) continue;
      if ((race === 5 || race === 6) && c === 7) {
        await out("\n" + T + "Impossible combination!\n" + T + "You cannot be a Troll or Orc in combination with\n" + T + "the Paladin profession.\n");
        await pause(); continue;
      }
      cls_ = c;
    }
    const made = await call("create", { sex, race, cls: cls_ });
    if (!made) return false;
    cls();
    await out("\n" + HI + "We welcome " + PLY + esc(P.name) + HI + ", a young brave " + P.race + " " + P.cls + "!\n\n" +
      T + "You start with " + GOLD + n(P.gold) + T + " gold coins, " + WHITE + n(P.healing) + T + " healing potions and " + WHITE + P.maxhps + T + " hitpoints.\n" +
      T + "Every day you get " + WHITE + P.fights + T + " dungeon fights and " + WHITE + P.pfights + T + " player fights.\n" +
      T + "Buy a weapon and some armor before you go down into the dungeons.\n" +
      T + "When you quit, sleep at the Inn if you can afford it: people\n" + T + "sleeping in the Dormitory get robbed and murdered.\n");
    await pause();
    return true;
  }

  async function showMail(mails) {
    cls();

  async function monsterFight(r) {
    let menu = true;
    while (r && r.fight) {
      const f = r.fight, alive = f.mons.filter(m => m.alive);
      await out("\n" + T + "You are fighting : " + MON + f.list + "\n" + PLY + "Your " + T + "hitpoints : " + WHITE + n(P.hps) + T + "/" + WHITE + n(P.maxhps) + "\n");
      if (menu) {
        const items = ["{A}ttack", "{R}un", "{H}eal", "{Q}uick Heal", "{D}etailed list", "{S}tatus", "{F}ight to Death", "{B}eg for Mercy"];
        if (P.caster) items.push("{C}ast Spell");
        if (P.canBackstab) items.push("{1} Backstab");
        if (P.canSoul) items.push("{1} Soul Strike");
        await out(cols(items, 22));
        menu = false;
      }
      await out("|06:" + T + " ");
      const k = await readKey("ARHQDSFBC1?", { enter: "A" });
      outNow("\n");
      if (k === "?") { menu = true; continue; }
      if (k === "S") { await status(); menu = true; continue; }
      if (k === "D") {
        for (const m of alive) await out(MON + m.name + T + " (" + n(m.hps) + " hps)\n");
        continue;
      }
      if (k === "C" && !P.caster) continue;
      if (k === "1" && !P.canBackstab && !P.canSoul) continue;
      const body = { cmd: k };
      if (["A", "C", "1"].includes(k) && alive.length > 1) {
        await out(T + "Attack which one?\n" + alive.slice(0, 9).map((m, i) => T + "{" + (i + 1) + "} " + MON + m.name + T + " (" + n(m.hps) + " hps)").join("\n") + "\n" + T + ": ");
        const t = await readKey("123456789".slice(0, Math.min(9, alive.length)), { enter: "1" });
        outNow("\n");
        body.target = alive[+t - 1].i;
      }
      if (k === "H") {
        if (P.hps >= P.maxhps) { await out(T + "You are in no need of healing!\n"); continue; }
        body.n = await num("Quaff how many potions (you have " + n(P.healing) + ")", 0);
      }
      if (k === "F" && !(await yn("Fight to Death", "Y"))) continue;
      if (k === "B" && !(await yn("Beg for Mercy", "N"))) continue;
      if (k === "1" && P.canSoul) {
        if (P.hps < 2) { await out(T + "Sorry, too few hitpoints left!\n"); continue; }
        body.amount = await num("How many hitpoints to use (max " + n(P.hps - 1) + ")", 0);
        if (!body.amount) continue;
      }
      if (k === "C") {
        const known = P.spells.filter(s => s.ok);
        if (!known.length) { await out(T + "You don't know any spells you can use here yet.\n"); continue; }
        await out(T + "Mana : " + WHITE + P.mana + "/" + P.maxmana + "\n" +
          known.map(s => T + "{" + "ABCDEFGHIJKL"[s.n - 1] + "} " + pad(s.name, 17) + DIM + s.cost + " mana").join("\n") + "\n" + T + "{X} Never mind : ");
        const keys = known.map(s => "ABCDEFGHIJKL"[s.n - 1]).join("") + "X";
        const sk = await readKey(keys, { enter: "X" });
        outNow("\n");
        if (sk === "X") continue;
        body.spell = "ABCDEFGHIJKL".indexOf(sk) + 1;
      }
      r = await call("fight", body);
      if (!r) return;
      if (r.dead) { await pause(); return "dead"; }
    }
  }

    }

  async function itemPages(list, armor) {
    const per = 16;
    let page = 0;
    const own = armor ? P.armor : P.weapon;
    while (true) {
      cls();
      await out("\n" + HEAD + (armor ? " Ancient Armors" : " Ancient Weapons") + "               Price    Power\n");
      list.slice(page * per, page * per + per).forEach(([name, price, pow], i) => {
        const no = page * per + i + 1;
        const afford = price <= P.gold;
        outNow("|03 " + lpad(no, 3) + " " + (afford ? ITEM : DIM) + pad(name, 24) + (afford ? GOLD : DIM) + lpad(n(price), 10) + T + lpad(pow, 8) + (name === own ? HI + "  (yours)" : "") + "\n");
      });
      const pages = Math.ceil(list.length / per);
      await out("\n" + T + "Page " + (page + 1) + " of " + pages + "   {N}ext  {P}rev  {Q}uit : ");
      const k = await readKey("NPQ", { enter: "N" });
      if (k === "Q") return;
      if (k === "N") page = (page + 1) % pages;
      if (k === "P") page = (page + pages - 1) % pages;
    }
  }

      "\n" + T + "{A}bort : ");

  // ------------------------------------------------------------ player fights (PLVSPLC.PAS)
  async function playerFight(r) {
    await pause();
    let menu = true;
    while (r && r.fight && r.fight.mode === "pvp") {
      const f = r.fight;
      await out("\n" + PLY + "Your" + T + " hitpoints : " + WHITE + n(P.hps) + "\n" + PLY + esc(f.foe) + "s" + T + " hitpoints : " + WHITE + n(f.foeHps) + "\n");
      if (menu) {
        const items = ["{A}ttack", "{H}eal", "{Q}uick Heal", "{F}ight to Death", "{S}tatus"];
        if (P.canBackstab) items.push("{1} Backstab");
        if (P.canSoul) items.push("{1} Soul Strike");
        await out(cols(items, 22));
        menu = false;
      }
      await out("|06:" + T + " ");
      const k = await readKey("AHQFS1?", { enter: "A" });
      outNow("\n");
      if (k === "?") { menu = true; continue; }
      if (k === "S") { await status(); menu = true; continue; }
      if (k === "1" && !P.canBackstab && !P.canSoul) continue;
      const body = { cmd: k };
      if (k === "H") body.n = await num("Quaff how many potions (you have " + n(P.healing) + ")", 0);
      if (k === "F" && !(await yn("Fight to Death", "N"))) continue;
      if (k === "1" && P.canSoul) { body.amount = await num("How many hitpoints to use (max " + n(P.hps - 1) + ")", 0); if (!body.amount) continue; }
      r = await call("pvp", body);
      if (!r) return;
      if (r.dead) { await pause(); return "dead"; }
    }
    if (r && r.fight && r.fight.mode === "beg") {
      const spare = await yn("Spare " + esc(r.fight.foe) + "s miserable life", "N");
      r = await call("pvp/spare", { spare });
    }
    if (r && r.fight && r.fight.mode === "dng") return;   // the prison gate: guards come next (fightLoop)
    if (r && r.fight && r.fight.mode === "loot") {
      const take = r.fight.gold > 0 ? await yn("Take the gold", "Y") : false;
      let note = "";
      if (await yn("Leave a note to " + esc(r.fight.foe), "N")) {
        await out(T + "Enter Message [1 line]\n" + T + ":");
        note = await readLine({ max: 70 });
        if (note) await out(HI + "Message sent...\n");
      }
      r = await call("pvp/loot", { take, note });
    }
    await pause();
  }

  // ============================================================ phase 2: the realm

  async function fightLoop(r) {
    while (r && r.fight) {
      if (r.fight.mode === "dng") { if (await monsterFight(r) === "dead") return "dead"; r = lastR; continue; }
      if (["pvp", "beg", "loot"].includes(r.fight.mode)) { if (await playerFight(r) === "dead") return "dead"; r = lastR; continue; }
      break;
    }
    if (r && r.jailed) { await pause(); return "jailed"; }
    if (r && r.dead) return "dead";
    return null;
  }

  async function gcall(action, body) {   // like call(), for the Immortals

      if (r.out && r.out.length) await out(r.out.join("\n") + "\n|07");

  // ============================================================ dungeon events (DUNGEVC.PAS, DUNGEV2.PAS)
  // The board asks; the options come with the answer. Fights in between go through monsterFight.
  async function eventLoop(r) {
    while (r) {
      if (r.dead) { await pause(); return "dead"; }
      if (r.uman) { await pause(); const x = await umanCave(); if (x) return x; return; }
      if (r.fight) {
        await pause();
        if (await monsterFight(r) === "dead") return "dead";
        r = lastR;
        if (!r || !r.event) { await pause(); return; }
        continue;
      }
      const e = r.event;
      if (!e) { await pause(); return; }
      let body;
      if (e.number) {
        const v = await num(e.prompt || "How much", 0);
        body = { key: "#", n: v || 0 };
      } else {
        await out("\n" + e.options.map(o => T + "{" + o[0] + "} " + esc(o[1])).join(e.options.length > 4 ? (e.options.length > 8 ? "   " : "\n") : "\n") + "\n" + T + (e.prompt ? esc(e.prompt) + " " : "") + ":");
        const k = await readKey(e.options.map(o => o[0]).join(""));
        outNow("\n");
        body = { key: k };
      }
      r = await call("dng/event", body);
    }
  }
