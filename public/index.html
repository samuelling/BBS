const pending = new Set();

    const entry = { rej };

function parse(str) {
  const ops = [];
  let buf = "";
  const flush = () => { if (buf) { ops.push({ text: buf, fg, bg }); buf = ""; } };
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];

async function dial() {
  setMode("dialing");
  outNow("\n");
  let result = null, failed = null, settled = false;
  const call = () => rawFetch("dial", { headers: { "content-type": "application/json" }, body: JSON.stringify({ modem: MODEM.id }) })
    .then(r => r.json()).then(d => { result = d; }).catch(e => { failed = e; }).finally(() => { settled = true; });
  if (MODEM.telnet) {
    await out("|07telnet bbs.megazine.org\n|08Trying bbs.megazine.org...\n");
    await call();
    if (!result || result.error) { await out("|12telnet: connect to host: Connection timed out\n"); setMode("offline"); state = "nodial"; return false; }
    if (result.busy) { await out("|12telnet: All " + result.lines + " node" + (result.lines > 1 ? "s are" : " is") + " busy. Connection refused.\n"); setMode("offline"); return false; }
    token = result.token; myNode = result.node; LINES = result.lines; TIME_MIN = result.timeMin;
    await out("|07Connected to bbs.megazine.org.\nEscape character is '^]'.\n");
    CPS = MODEM.cps;
    setMode("online");
    await sleep(300);
    return true;
  }
  await out("|07ATZ\n"); await sleep(250);
  await out("|15OK\n"); await sleep(300);
  await out("|07ATDT" + PHONE + "\n");
  await A.dialTone();
  await A.dtmf(PHONE);
  call();
  let rings = 0;
  while ((rings < 2 || !settled) && rings < 6) { await A.ring(); rings++; }
  if (!result || result.error) {
    await out("|12NO DIALTONE\n|08The board isn't answering. It may not be installed yet, or the line is down.\n");
    setMode("offline"); state = "nodial";
    return false;
  }
  if (result.busy) {
    await out("|12BUSY\n");
    await A.busy();
    setMode("offline");
    return false;
  }
  token = result.token; myNode = result.node; LINES = result.lines; TIME_MIN = result.timeMin;
  if (myNode > 1) await out("|08(line " + (myNode - 1 === 1 ? "1 is" : "1-" + (myNode - 1) + " are") + " busy, rolling over to line " + myNode + ")\n");
  await A.handshake(MODEM.hs);
  await out("|15" + MODEM.connect + "\n");
  CPS = MODEM.cps;
  setMode("online");
  await sleep(400);
  return true;
}

async function editor() {
  await out("|08Enter your message. |07/S|08 on a line by itself saves, |07/A|08 aborts. 40 lines max.\n" + rule(8, "-", 76));
  const lines = [];
  while (lines.length < 40) {
    await out("|08" + lpad(lines.length + 1, 2) + ": |07");
    const l = await readLine({ max: 74 });
    if (l.trim().toUpperCase() === "/A") { await out("|12Aborted.\n"); await sleep(400); return null; }
    if (l.trim().toUpperCase() === "/S") break;
    lines.push(l);
  }
  if (!lines.join("").trim()) { await out("|12Empty message. Not saved.\n"); await sleep(500); return null; }

}

// The board stays a BBS, except here: pictures open in a modern pop-up you can flip through
// (arrow keys, swipe, the dots, or the buttons). Esc, X or a click outside closes it.
const pixUrls = new Map();   // file id -> inline link (good for 30 minutes)
async function pixUrl(f) {
  const hit = pixUrls.get(f.id);
  if (hit && Date.now() - hit.at < 25 * 60_000) return hit.url;
  const r = await api("imgurl", { id: f.id });
  const url = API + r.url;
  pixUrls.set(f.id, { url, at: Date.now() });
  return url;
}
function pictureViewer(files, start) {
  if (!files.length) return Promise.resolve();
  act("Looking at pictures");
  let el = document.getElementById("pix");
  if (!el) {
    el = document.createElement("div"); el.id = "pix"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Picture viewer");
    el.innerHTML = '<div class="count"></div><button class="x" aria-label="Close">&#x2715;</button>' +
      '<button class="prev" aria-label="Previous">&#x2039;</button><button class="next" aria-label="Next">&#x203A;</button>' +
      '<figure><img alt=""><figcaption></figcaption></figure><div class="strip"></div>';
    document.body.appendChild(el);
  }
  const img = el.querySelector("img"), cap = el.querySelector("figcaption"), count = el.querySelector(".count"), strip = el.querySelector(".strip");
  let i = start, done, seq = 0;
  strip.innerHTML = files.length > 1 ? files.map((_, n) => '<i data-n="' + n + '"></i>').join("") : "";
  const show = async () => {
    const f = files[i], my = ++seq;
    count.textContent = files.length > 1 ? (i + 1) + " / " + files.length : "";
    cap.innerHTML = ""; const b = document.createElement("b"); b.textContent = f.filename; cap.appendChild(b);
    const sub = document.createElement("span"); sub.textContent = "  " + (f.descr || "") + "  ·  uploaded by " + f.uploader;
    cap.appendChild(document.createElement("br")); cap.appendChild(sub);
    strip.querySelectorAll("i").forEach((d, n) => d.classList.toggle("cur", n === i));
    img.classList.add("loading");
    try {
      const url = await pixUrl(f);
      if (my !== seq) return;
      img.onload = () => { if (my === seq) img.classList.remove("loading"); };
      img.onerror = () => { if (my === seq) { img.classList.remove("loading"); sub.textContent = "  Couldn't load this one."; sub.className = "err"; } };
      img.src = url; img.alt = f.descr || f.filename;
      // Warm up the neighbors so flipping feels instant.
      for (const n of [i + 1, i - 1]) { const g = files[(n + files.length) % files.length]; if (g !== f) pixUrl(g).then(u => { const pre = new Image(); pre.src = u; }).catch(() => {}); }
    } catch (e) { if (my === seq) { img.classList.remove("loading"); sub.textContent = "  " + (e.message || "Line noise."); } }
  };
  const go = d => { i = (i + d + files.length) % files.length; show(); };
  const close = () => { el.classList.remove("on"); document.removeEventListener("keydown", onKey, true); img.removeAttribute("src"); done(); };
  const onKey = e => {
    e.stopPropagation(); e.preventDefault();
    if (e.key === "ArrowRight" || e.key === " " || e.key === "n" || e.key === "N") go(1);
    else if (e.key === "ArrowLeft" || e.key === "p" || e.key === "P") go(-1);
    else if (e.key === "Escape" || e.key === "q" || e.key === "Q" || e.key === "Enter") close();
  };
  el.querySelector(".x").onclick = close;
  el.querySelector(".prev").onclick = e => { e.stopPropagation(); go(-1); };
  el.querySelector(".next").onclick = e => { e.stopPropagation(); go(1); };
  el.querySelector(".prev").style.display = el.querySelector(".next").style.display = files.length > 1 ? "" : "none";
  strip.onclick = e => { const n = e.target.dataset && e.target.dataset.n; if (n !== undefined) { e.stopPropagation(); i = +n; show(); } };
  el.onclick = e => { if (e.target === el) close(); };
  let x0 = null;
  el.ontouchstart = e => { x0 = e.touches[0].clientX; };
  el.ontouchend = e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); };
  document.addEventListener("keydown", onKey, true);
  el.classList.add("on");
  show();
  return track((res, rej, entry) => { done = res; entry.cancel = () => { el.classList.remove("on"); document.removeEventListener("keydown", onKey, true); }; });
}

// CP437 for the upper half, so ANSI art from the era renders right.
const CP437 = "ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ";
function decodeBytes(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  catch (e) { let s = ""; for (const x of bytes) s += x < 128 ? String.fromCharCode(x) : CP437[x - 128]; return s; }
}
// Render ANSI art (or plain text) the way ANSI.SYS would: an 80-column screen with cursor
// movement, colors and auto-wrap, then turn each screen row into a line of pipe codes.
function ansiToRows(text) {
  const W = 80, MAXROWS = 3000, map = [0, 4, 2, 6, 1, 5, 3, 7];
  const rows = [];
  let r = 0, c = 0, fg = 7, bold = false, bg = 0, saved = [0, 0], wrapPending = false;
  const put = ch => {
    if (wrapPending) { r++; c = 0; wrapPending = false; }
    if (r >= MAXROWS) return;
    while (rows.length <= r) rows.push([]);
    rows[r][c] = { ch, f: (bold ? 8 : 0) + fg, b: bg };
    if (c === W - 1) wrapPending = true; else c++;
  };
  const end = text.indexOf("\x1a");            // SAUCE record and anything after it isn't art
  if (end >= 0) text = text.slice(0, end);
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === "\x1b" && text[i + 1] === "[") {
      let j = i + 2, params = "";
      while (j < text.length && /[\d;?=]/.test(text[j])) params += text[j++];
      const cmd = text[j]; i = j;
      const ps = params.replace(/[?=]/g, "").split(";").map(x => (x === "" ? NaN : +x));
      const n = Number.isNaN(ps[0]) ? 1 : Math.max(1, ps[0]);
      if (cmd === "m") {
        for (const x of (params === "" ? [0] : ps.map(v => (Number.isNaN(v) ? 0 : v)))) {
          if (x === 0) { fg = 7; bold = false; bg = 0; }
          else if (x === 1) bold = true;
          else if (x === 22) bold = false;
          else if (x >= 30 && x <= 37) fg = map[x - 30];
          else if (x === 39) fg = 7;
          else if (x >= 40 && x <= 47) bg = map[x - 40];
          else if (x === 49) bg = 0;
        }
      } else if (cmd === "C") { c = Math.min(W - 1, c + n); wrapPending = false; }
      else if (cmd === "D") { c = Math.max(0, c - n); wrapPending = false; }
      else if (cmd === "A") { r = Math.max(0, r - n); wrapPending = false; }
      else if (cmd === "B") { r = Math.min(MAXROWS - 1, r + n); wrapPending = false; }
      else if (cmd === "H" || cmd === "f") {
        r = Math.min(MAXROWS - 1, (Number.isNaN(ps[0]) ? 1 : ps[0]) - 1); c = Math.min(W - 1, (Number.isNaN(ps[1]) ? 1 : ps[1]) - 1);
        r = Math.max(0, r); c = Math.max(0, c); wrapPending = false;
      } else if (cmd === "s") saved = [r, c];
      else if (cmd === "u") { [r, c] = saved; wrapPending = false; }
      // J (clear), K (erase line), h/l (modes) and anything else: nothing to draw.
      continue;
    }
    if (ch === "\r") { c = 0; wrapPending = false; continue; }
    if (ch === "\n") { r++; c = 0; wrapPending = false; continue; }
    if (ch === "\t") { const to = Math.min(W, (Math.floor(c / 8) + 1) * 8); while (c < to && !wrapPending) put(" "); continue; }
    if (ch < " " || ch === "\x7f") continue;
    put(ch);
  }
  // Rows of cells -> pipe-code strings. "|" and "{x}" would be read as codes, so swap them.
  const two = n => String(n).padStart(2, "0");
  return rows.map(row => {
    let last = row.length;
    while (last > 0 && (!row[last - 1] || (row[last - 1].ch === " " && row[last - 1].b === 0))) last--;
    let out = "", cf = -1, cb = -1;
    for (let k = 0; k < last; k++) {
      const cell = row[k] || { ch: " ", f: 7, b: 0 };
      if (cell.b !== cb) { out += "|" + (16 + cell.b); cb = cell.b; }
      if (cell.f !== cf) { out += "|" + two(cell.f); cf = cell.f; }
      out += cell.ch === "|" ? "¦" : cell.ch === "{" ? "(" : cell.ch === "}" ? ")" : cell.ch;
    }
    return out + "|16|07";
  });
}
async function viewFile(f) {
  act("Reading " + f.filename);
  const r = await api("view", { id: f.id });
  const lines = ansiToRows(decodeBytes(r.b64));
  while (lines.length && lines[lines.length - 1] === "|16|07") lines.pop();
  // Art needs the real PC font: the board's VT323 has no block characters, and fallback fonts
  // are a different width, so blocks drift out of line. Switch for the viewer, then back.
  const art = /\.(ans|ice|diz|nfo|asc)$/i.test(f.filename) || lines.some(l => /[\u2580-\u259f]/.test(l));
  if (art) await artMode(true);
  try { await pager("|15 " + f.filename + "\n" + rule(8), lines, art ? 24 : 20); }
  finally { if (art) await artMode(false); }
}
async function artMode(on) {
  if (on && document.fonts) { try { await document.fonts.load('16px "IBM VGA"'); } catch (e) {} }
  cls(); await out("");
  scr.classList.toggle("art", on); measure(); fit();
}
async function download(f, side) {

  if (r.ratio === false) {
    await out("\n\n|12 RATIO CHECK FAILED.|07 This file costs |15" + K(r.cost) + "|07 and you have |15" + K(r.credit) + "|07.\n" +
      (side === "elite" ? " |08Upload something to the Septic Tank first, leech. Ratio down here is 1:" + (INFO ? INFO.rules.eliteRatio : 3) + ".\n"
        : " |08Upload a file and you'll earn " + (INFO ? INFO.rules.mainRatio : 5) + "x its size in credit once it's validated.\n"));
    return anyKey();
  }
  if (side === "elite") S.user.credit_elite = r.credit; else S.user.credit_main = r.credit;
  await out("\n\n|07Protocol: {Z} Zmodem  {Y} Ymodem-G  {X} Xmodem-1K |15");
  const p = await readKey("ZYX", { enter: "Z" });
  const proto = { Z: "Zmodem", Y: "Ymodem-G", X: "Xmodem-1K" }[p];
  outNow("\n|11 " + proto + " send: |15" + f.filename + "  |08(" + f.size.toLocaleString("en-US") + " bytes)\n");
  const bar = await outEl("f7");
  // The real file arrives at broadband speed; the meter runs at your modem's speed (capped at 90 s).
  const lineCps = Math.min(CPS, MODEM.cps);
  const dur = Math.min(90000, Math.max(600, f.size / lineCps * 1000)), t0 = Date.now();
  let skipped = false;
  if (dur > 5000) outNow("|08 (any key skips the wait)\n");
  const skipKey = readKey(null); skipKey.then(() => { skipped = true; }).catch(() => {});
  while (true) {
    const pr = skipped ? 1 : Math.min(1, (Date.now() - t0) / dur);
    drawBar(bar, pr, f.size, Math.round(lineCps * (0.94 + Math.random() * 0.05)));
    if (pr >= 1) break;
    await sleep(100);
  }
  if (want && !skipped) { want = null; renderLive(); }
  const a = document.createElement("a");
  a.href = API + r.url; a.download = f.filename; a.rel = "noopener";
  document.body.appendChild(a); a.click(); a.remove();
  await out("|10 Transfer complete.|07 Your browser is saving |15" + f.filename + "|07.\n" +
    (r.cost ? "|08 " + K(r.cost) + " deducted. Credit left: " + K(r.credit) + "\n" : "|08 Free file. No credit used.\n") +
    "|08 If it didn't start, call back within 10 minutes and the same link works.\n");
  await anyKey();
}
function xferTime(bytes) {
  const secs = bytes / Math.min(CPS, MODEM.cps);
  if (secs < 60) return Math.max(1, Math.round(secs)) + " sec";
  if (secs < 3600) return Math.round(secs / 60) + " min";
  return (secs / 3600).toFixed(1) + " hours";
}
function drawBar(bar, pr, size, cps) {
  const n = Math.round(pr * 40);
  bar.textContent = " [" + "#".repeat(n) + ".".repeat(40 - n) + "] " + lpad(Math.round(pr * 100), 3) + "%  " + cps.toLocaleString("en-US") + " cps  " + K(pr * size) + "\n";
  scrollDown();
}
// Resolves with the file the caller picks (or null). The picker itself is opened by the keypress.
function waitForPick() {
  picker.value = "";
  return track((res, rej, entry) => {
    const done = v => { picker.onchange = null; picker.oncancel = null; res(v); };
    picker.onchange = () => done(picker.files && picker.files[0] || null);
    picker.oncancel = () => done(null);
    entry.cancel = () => { picker.onchange = null; picker.oncancel = null; };
  });
}
async function uploadFile(area, side) {
  const elite = side === "elite";
  const ru = INFO ? INFO.rules : { mainRatio: 5, eliteRatio: 3, maxUpload: 52428800 };
  act("Uploading");
  cls();
  await out((elite ? "|13" : "|11") + " Upload to " + area.name + "\n" + rule(elite ? 5 : 3) +
    "|07 Max |15" + K(ru.maxUpload) + "|07 per file. Uploads wait for the SysOp to validate them.\n" +
    " Once approved you earn |15" + (elite ? ru.eliteRatio : ru.mainRatio) + "x|07 the file's size in " + (elite ? "Septic Tank" : "download") + " credit.\n" +
    " |08Only upload things you have the right to share. No viruses.\n\n" +
    "|07Description (one line): |15");
  const descr = (await readLine({ max: 50 })).trim();
  if (!descr) return;
  await out("\n|07{S} Start upload (pick a file)   {Q} Cancel |15");
  const picked = waitForPick();
  picked.catch(() => {});
  if ((await readKey("SQ", { enter: "S", sync: { S: () => picker.click() } })) === "Q") { picker.onchange = picker.oncancel = null; return; }
  outNow("\n|08Waiting for your Zmodem upload... |07(any key cancels)\n");
  const cancelKey = readKey(null); cancelKey.catch(() => {});
  const file = await Promise.race([picked, cancelKey.then(() => null)]);
  if (want) { want = null; renderLive(); }
  if (!file) { await out("|12Upload cancelled.\n"); await sleep(600); return; }
  if (file.size > ru.maxUpload) { await out("|12Too big. The limit is " + K(ru.maxUpload) + ".\n"); return anyKey(); }
  await out("|11 Zmodem receive: |15" + esc(file.name) + "  |08(" + file.size.toLocaleString("en-US") + " bytes)\n");
  const bar = await outEl("f7");
  const t0 = Date.now();
  const result = await track((res, rej, entry) => {
    const xhr = new XMLHttpRequest();
    entry.cancel = () => xhr.abort();
    xhr.open("POST", API + "/api/upload");
    xhr.setRequestHeader("x-line", token);
    xhr.setRequestHeader("x-area", String(area.id));
    xhr.setRequestHeader("x-filename", encodeURIComponent(file.name));
    xhr.setRequestHeader("x-desc", encodeURIComponent(descr));
    xhr.setRequestHeader("content-type", "application/octet-stream");
    xhr.upload.onprogress = e => { if (e.lengthComputable) drawBar(bar, e.loaded / e.total, file.size, Math.round(e.loaded / Math.max(0.1, (Date.now() - t0) / 1000))); };
    xhr.onload = () => { let d; try { d = JSON.parse(xhr.responseText); } catch (e) { d = { error: "Garbled response (" + xhr.status + ")." }; } res({ status: xhr.status, d }); };
    xhr.onerror = () => res({ status: 0, d: { error: "Line noise. Transfer aborted." } });
    xhr.send(file);
  });
  if (result.d.carrier === false) { dropCarrier("|12*** " + esc(result.d.error || "NO CARRIER")); throw new Hangup(); }
  if (result.status !== 200) throw new BoardError(result.d.error || "Upload failed.");
  drawBar(bar, 1, file.size, Math.round(file.size / Math.max(0.1, (Date.now() - t0) / 1000)));
  if (result.d.pending)
    await out("|10 Got it: |15" + result.d.filename + "|10.|07 It's in the validation queue.\n" +
      " |08You'll get " + K(result.d.size * (elite ? ru.eliteRatio : ru.mainRatio)) + " of credit when the SysOp approves it. Thanks, d00d.\n");
  else await out("|10 Uploaded |15" + result.d.filename + "|10. SysOp uploads go live right away.\n");
  await anyKey();
}

const ITEMS = { wrench: "a heavy pipe wrench", ring: "a gold wedding ring" };
async function adventure() {
  act("Playing Escape the Tank");
  cls();
  await out("|14 E S C A P E   T H E   T A N K\n|08 a text adventure by ThE PLuMBeR - type HELP for commands\n" + rule(6));
  const roomItems = {}; for (const k in ROOMS) roomItems[k] = (ROOMS[k].items || []).slice();
  let here = "bowl", inv = [], moves = 0, score = 0;
  const look = async () => {
    const r = ROOMS[here];
    await out("\n|15" + r.name + "\n|07" + wrap(r.desc) + "\n");
    for (const it of roomItems[here]) await out("|07You see " + ITEMS[it] + " here.\n");
    const ex = Object.keys(r.exits);
    await out("|08Exits: " + (ex.length ? ex.join(", ") : "none") + "\n");
  };
  await look();
  while (true) {
    await out("\n|14> |15");
    const raw = (await readLine({ max: 40 })).trim().toLowerCase();
    if (!raw) continue;
    moves++;
    let [verb, ...rest] = raw.split(/\s+/); const noun = rest.join(" ").replace(/^(the|a|an) /, "");
    const dirs = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };
    if (dirs[verb]) verb = dirs[verb];
    if (verb === "go" && noun) verb = dirs[noun] || noun;
    if (["north", "south", "east", "west", "up", "down"].includes(verb)) {
      const heavy = inv.includes("wrench");
      if (here === "scum" && verb === "down" && !heavy) { await out("|07You dive. You're a rubber duck. You bob right back up.\n"); continue; }
      if (here === "outlet" && verb === "up" && heavy) { await out("|07You try to rise, but the wrench holds you down like an anchor.\n"); continue; }
      if (here === "scum" && verb === "east") { await out("|07The baffle wall is in the way up here.\n"); continue; }
      const to = ROOMS[here].exits[verb];
      if (!to) { await out("|07You can't go that way.\n"); continue; }
      here = to; await look();
      if (here === "field") {
        score += 50; if (inv.includes("ring")) score += 50;
        await out("\n|10*** You escaped the tank in " + moves + " moves. Score: " + score + " of 100. ***\n");
        if (!inv.includes("ring")) await out("|08Rumor has it something valuable sank to the bottom...\n");
        return anyKey();
      }
      continue;
    }
    if (verb === "look" || verb === "l") { await look(); continue; }
    if (verb === "inventory" || verb === "i" || verb === "inv") { await out("|07You carry: " + (inv.length ? inv.map(i => ITEMS[i]).join(", ") : "nothing. You're a duck.") + "\n"); continue; }
    if (verb === "take" || verb === "get") {
      const it = Object.keys(ITEMS).find(k => noun.includes(k));
      if (!it || !roomItems[here].includes(it)) { await out("|07You don't see that here.\n"); continue; }
      roomItems[here] = roomItems[here].filter(x => x !== it); inv.push(it);
      await out("|07Taken. " + (it === "wrench" ? "It's heavy. You ride a little lower in the water." : "Someone's going to be very happy. Or very embarrassed.") + "\n");
      continue;
    }
    if (verb === "drop") {
      const it = inv.find(k => noun.includes(k));
      if (!it) { await out("|07You don't have that.\n"); continue; }
      inv = inv.filter(x => x !== it); roomItems[here].push(it);
      await out("|07Dropped. " + (it === "wrench" ? "You feel buoyant again." : "") + "\n");
      continue;
    }
    if (verb === "help" || verb === "?") { await out("|07Commands: LOOK, N/S/E/W/UP/DOWN, TAKE <thing>, DROP <thing>, INVENTORY, QUIT\n"); continue; }
    if (verb === "quack") { await out("|07Quack. It echoes off the concrete.\n"); continue; }
    if (verb === "quit" || verb === "q") { await out("|07You give up and wait for the pump truck.\n"); await sleep(600); return; }
    await out("|07I don't know how to \"" + esc(verb) + "\".\n");
  }
}

// One screen for every kind of chat: lines arrive above your input line while you type.
async function chatRoom(room, title, opts = {}) {
  act(opts.act || "Teleconference");
  const hc = room === "pool" ? "|13" : opts.private ? "|12" : "|11";
  cls();
  await out(hc + " " + title + "\n" + rule(room === "pool" ? 5 : opts.private ? 4 : 3) +
    "|08 Type and press Enter to talk. |07/Q|08 leaves, |07/W|08 shows who's here. Pipe codes (|07!12|08) add color.\n\n");
  let lastId = 0, members = [], stopped = false, polling = false, misses = 0, timer = null;
  const tk = token;
  const show = m => {
    if (m.kind === "join") outNow("|08*** " + esc(m.handle) + " joined" + "|07\n");
    else if (m.kind === "leave") outNow("|08*** " + esc(m.handle) + " left" + "|07\n");
    else {
      const mine = S && m.handle === S.user.handle;
      outNow((mine ? "|14" : opts.private ? "|12" : "|11") + "<" + esc(m.handle) + "> |07" + uc(m.text) + "\n");
    }
  };
  const poll = async () => {
    if (token !== tk || state !== "online") { stopped = true; clearInterval(timer); }
    if (stopped || polling) return;
    polling = true;
    try {
      const r = await api("chat/poll", { room, after: lastId });
      if (stopped) return;
      for (const m of r.msgs) { if (m.id > lastId) { show(m); lastId = m.id; } }
      const before = members.join(",");
      members = r.members;
      if (opts.onMembers) opts.onMembers(members, before);
      misses = 0;
    } catch (e) { if (++misses === 3) outNow("|12*** Line noise. Chat messages may be delayed.|07\n"); }
    finally { polling = false; }
  };
  await poll();
  if (!lastId) outNow("|08 (quiet in here)|07\n");
  outNow("|08 Here now: |07" + members.map(esc).join(", ") + "\n");
  timer = setInterval(poll, 1500);
  try {
    while (true) {
      const text = (await readLine({ max: 200, prompt: "> ", noEcho: true })).trim();
      if (!text) continue;
      if (/^\/(q|quit|x|exit)$/i.test(text)) break;
      if (/^\/(w|who)$/i.test(text)) { outNow("|08*** Here now: |07" + members.map(esc).join(", ") + "\n"); continue; }
      try { await api("chat/say", { room, text }); }
      catch (e) { if (e instanceof BoardError) outNow("|12*** " + esc(e.message) + "|07\n"); else throw e; }
      poll();
    }
  } finally {
    stopped = true; clearInterval(timer);
  }
  try { await api("chat/leave"); } catch (e) { if (e instanceof Hangup) throw e; }
}

// ---------------------------------------------------------------- door games (web/doors/*.js)
// ---- web/doors/_common.js
// Shared plumbing for door games. Every file in web/doors/ is pasted into app.js by build.py
// (sorted by name, so this one comes first) and can use the terminal helpers there:
// out, outNow, cls, readKey, readLine, anyKey, sleep, act, api, esc, uc, pad, lpad, wrap, rule, A (audio).
//
// A door registers itself:   DOOR.mygame = async function () { ... };
// and returns when the caller quits. Throwing is fine: guard() reports the error and comes back to the menu.
const DOOR = {};

// Static files a door needs (story files, wasm). Relative, so it works on the Worker and on GitHub Pages.
function doorAsset(name) { return "doors/" + name; }
async function doorFetch(name) {
  const r = await fetch(doorAsset(name));
  if (!r.ok) throw new Error("Couldn't load " + name + " (" + r.status + ")");
  return new Uint8Array(await r.arrayBuffer());
}

// One saved game per caller per door, kept on the board (up to ~60K of text; base64 binary saves).
async function doorSave(game, data) { return api("door/save/put", { game, data }); }
async function doorLoad(game) { const r = await api("door/save/get", { game }); return r.save; }   // { data, at } or null
async function doorDelSave(game) { return api("door/save/del", { game }); }
// High scores: the board keeps each caller's best.
async function doorScore(game, score, detail) { try { return await api("door/score/put", { game, score: Math.round(score), detail: detail || "" }); } catch (e) { return null; } }

function b64FromBytes(u8) { let s = ""; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode(...u8.subarray(i, i + 8192)); return btoa(s); }
function bytesFromB64(b64) { const s = atob(b64); const u8 = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i); return u8; }


// ---- web/doors/advent.js
// Colossal Cave Adventure — the real thing.
//
// This is Eric S. Raymond's Open Adventure (BSD-2-Clause), the faithful C version of Will Crowther
// and Don Woods's 1976-77 game, compiled to WebAssembly (public/doors/advent.wasm; rebuild with
// scripts/build_advent.sh). Below is just enough WASI for it to run in the terminal: its printf()s
// land on the screen, and its readline() waits for Q-Slodem's line input. Binaryen's asyncify pass
// lets the C code pause mid-call while the caller types. The game's SAVE file goes to the board.

class AdventExit extends Error { constructor(code) { super("exit " + code); this.code = code; } }

// Runs the program. io = { write(text), readLine() -> Promise<string|null>, loadSave() -> Uint8Array|null, storeSave(bytes) }
async function adventRun(wasmBytes, args, io) {
  let mem, ex, dataPtr = 0, pending = null, resumeLine = null, rewinding = false;
  const DATA_SIZE = 65536;
  const u8 = () => new Uint8Array(mem.buffer), dv = () => new DataView(mem.buffer);
  const dec = new TextDecoder("latin1"), enc = new TextEncoder();
  const argBytes = args.map(a => enc.encode(a + "\0"));

  const wasi = {
    args_sizes_get(argc, bufSize) { dv().setUint32(argc, args.length, true); dv().setUint32(bufSize, argBytes.reduce((n, b) => n + b.length, 0), true); return 0; },
    args_get(argv, buf) { let p = buf; argBytes.forEach((b, i) => { dv().setUint32(argv + i * 4, p, true); u8().set(b, p); p += b.length; }); return 0; },
    clock_time_get(id, prec, out) { dv().setBigUint64(out, BigInt(Date.now()) * 1000000n, true); return 0; },
    // Every fd is a terminal: the game then skips echoing input (Q-Slodem already shows it).
    fd_fdstat_get(fd, out) { const d = dv(); for (let i = 0; i < 24; i++) d.setUint8(out + i, 0); d.setUint8(out, 2); return 0; },
    fd_read() { return 52; },          // ENOSYS: input comes through readline()
    fd_seek() { return 70; },          // ESPIPE
    fd_close() { return 0; },
    fd_write(fd, iovs, n, written) {
      const d = dv(); let total = 0, s = "";
      for (let i = 0; i < n; i++) {
        const p = d.getUint32(iovs + i * 8, true), l = d.getUint32(iovs + i * 8 + 4, true);
        s += dec.decode(u8().subarray(p, p + l)); total += l;
      }
      if (fd === 1 || fd === 2) io.write(s);
      d.setUint32(written, total, true); return 0;
    },
    proc_exit(code) { throw new AdventExit(code); },
  };
  let saveBytes = null;
  const env = {
    js_readline(buf, max) {
      if (rewinding) {
        ex.asyncify_stop_rewind(); rewinding = false;
        const line = resumeLine; resumeLine = null;
        if (line === null) return -1;
        const b = enc.encode(line).subarray(0, max);
        u8().set(b, buf); return b.length;
      }
      // Park the C stack and come back once the caller has typed a line.
      const d = dv(); d.setUint32(dataPtr, dataPtr + 8, true); d.setUint32(dataPtr + 4, dataPtr + DATA_SIZE, true);
      pending = io.readLine();
      ex.asyncify_start_unwind(dataPtr);
      return 0;
    },
    js_save_size() { saveBytes = io.loadSave(); return saveBytes ? saveBytes.length : 0; },
    js_save_read(buf) { if (saveBytes) u8().set(saveBytes, buf); },
    js_save_write(buf, len) { io.storeSave(u8().slice(buf, buf + len)); },
  };
  const { instance } = await WebAssembly.instantiate(wasmBytes, { wasi_snapshot_preview1: wasi, env });
  ex = instance.exports; mem = ex.memory;
  dataPtr = ex.adv_alloc(DATA_SIZE);
  try {
    while (true) {
      ex._start();
      if (ex.asyncify_get_state() !== 1) return 0;     // ran to the end without exit()
      ex.asyncify_stop_unwind();
      resumeLine = await pending; pending = null;
      rewinding = true;
      ex.asyncify_start_rewind(dataPtr);
    }
  } catch (e) {
    if (e instanceof AdventExit) return e.code;
    throw e;
  }
}

DOOR.advent = async function () {
  cls();
  await out(
    "|14 C O L O S S A L   C A V E   A D V E N T U R E\n" + rule(6) +
    "|07 The original text adventure, by |15Will Crowther|07 (1976) and |15Don Woods|07 (1977).\n" +
    "|07 This is |15Open Adventure|07, Eric S. Raymond's faithful C version of Woods's\n" +
    "|07 430-point edition, BSD licensed, running here for real.\n\n" +
    "|08 Talk to it in one or two words: |07ENTER BUILDING|08, |07GET LAMP|08, |07NORTH|08, |07INVENTORY|08.\n" +
    "|08 |07SAVE|08 and |07RESUME|08 keep your place on the board. |07QUIT|08 ends the game.\n" + rule(6));

  const [wasm, save] = await Promise.all([doorFetch("advent.wasm"), doorLoad("advent").catch(() => null)]);
  let saved = save ? bytesFromB64(save.data) : null;
  const args = ["advent"];
  if (saved) {
    await out("|07 You have a saved game from |15" + d8(save.at) + "|07.  {R} Resume it  {N} New game  {Q} Back |15");
    const k = await readKey("RNQ", { enter: "R" });
    if (k === "Q") return;
    if (k === "R") args.push("-r", "advent.sav");
    outNow("\n");
  }

  // The game writes in bursts; show each burst when it stops to ask for input.
  let buf = "", all = "", lastAsk = "", pendingSave = null;
  const flush = async () => {
    if (!buf) return;
    let s = buf.replace(/\r/g, ""); buf = "";
    if (/^\nCan't open file .*, try again\.\n?$/.test(s) || /^Can't open file .*, try again\.\n?$/.test(s)) s = "\n|12No saved game on the board yet.|07\n";
    else s = "|07" + esc(s);
    // The command prompt in yellow.
    s = s.replace(/\n> $/, "\n|14> ").replace(/^> $/, "|14> ");
    await out(s);
  };
  const io = {
    write(t) { buf += t; all = (all + t).slice(-4000); },
    async readLine() {
      // The game asks for a save file name; the board has one slot, so answer for the caller.
      if (/File name: $/.test(buf)) {
        buf = buf.replace(/\nFile name: $/, "").replace(/File name: $/, "");
        await flush();
        if (lastAsk === "file") { lastAsk = ""; return ""; }     // the slot was empty: give up quietly
        lastAsk = "file";
        return "advent.sav";
      }
      lastAsk = "";
      await flush();
      const l = await readLine({ max: 76 });
      return l;
    },
    loadSave() { return saved; },
    storeSave(bytes) {
      saved = bytes;
      pendingSave = doorSave("advent", b64FromBytes(bytes));
    },
  };
  const code = await adventRun(wasm, args, io);
  await flush();
  if (pendingSave) {
    try { await pendingSave; await out("\n|10Game saved on the board.|07 Choose Resume next time you open this door.\n"); }
    catch (e) { await out("\n|12The board couldn't save your game: " + esc(e.message) + "|07\n"); }
  }
  const m = /You scored (\d+) out of a possible (\d+), using (\d+) turns?/.exec(all);
  if (m && !pendingSave) {
    await doorScore("advent", +m[1], m[1] + "/" + m[2] + " in " + m[3] + " turns");
  }
  await anyKey();
};

  const BUILD = [

    ["O", "outhouses", "Pay Outhouses", "earn 60 gold a year"],
    ["B", "bunks", "Bunkhouses", "house 50 troops each"],
    ["T", "towers", "Stink Towers", "defense; nobody wants to get close"],
    ["P", "thrones", "Porcelain Thrones", "monuments to you. Prestige. That's it."],
  ];
  const COST = { farms: 300, outhouses: 300, bunks: 300, towers: 300, thrones: 1500 };
  const UNITS = [
    ["P", "plungers", "Plungermen", 40, "1 attack, 1 defense, eats 1, 1 gold upkeep"],
    ["S", "slingers", "Slingers", 110, "1 attack, 2 defense, 2 gold upkeep"],
    ["W", "wagons", "Honey Wagons", 600, "6 attack, 2 defense, 3 crew, 10 upkeep"],
    ["N", "sniffers", "Sniffers", 250, "spies and saboteurs, 3 upkeep"],
  ];
  const n = v => Math.floor(v || 0).toLocaleString("en-US");
  const say = s => "|07" + esc(s);
  let R = null;   // the caller's realm, as the board last reported it

  async function ask(prompt, max) {
    await out(prompt);
    const s = (await readLine({ max: 10 })).trim().toLowerCase();
    if (!s) return null;
    if (s === "m" || s === "max") return max;
    const v = parseInt(s.replace(/,/g, ""), 10);
    return Number.isFinite(v) && v > 0 ? v : null;
  }
  async function act$(path, body) { const r = await api("door/barren/" + path, body); if (r.realm) R = r.realm; return r; }
  async function tell(msg) { await out("\n|10" + esc(msg) + "|07\n"); await sleep(900); }
  async function oops(fn) {
    try { return await fn(); }
    catch (e) { if (e instanceof BoardError) { await out("\n|12" + esc(e.message) + "|07\n"); await anyKey(); return null; } throw e; }
  }

  async function title(st) {
    cls();
    await out("\n" + LOGO.map((l, i) => "|" + ["14", "14", "06", "06", "12", "04"][i] + "        " + l).join("\n") + "\n");
    await out("|08                       - = |15E  L  I  T  E|08 = -\n\n");
    await out(SKYLINE.map((l, i) => (i < 2 ? "|08" : "|06") + "        " + l).join("\n") + "\n\n");
    if (st.top) await out("|07  Mightiest realm: |15" + esc(st.top.name) + " |08ruled by |14" + esc(st.top.handle) +
      " |08(" + n(st.top.land) + " acres, worth " + n(st.top.networth) + ")\n");
    else await out("|07  No realms yet. The land is empty, damp, and yours for the taking.\n");
    await out("|08  " + st.count + " realm" + (st.count === 1 ? "" : "s") + " in the world.  An original door for MEGAzine BBS.\n");
    await anyKey();
  }

  async function create() {
    cls();
    await out("|14 Found a Realm\n" + rule(6) + say(wrap(
      "The Plumbers' Guild grants you 250 soggy acres, 2,000 peasants, a modest army of Plungermen and a treasury that smells faintly of rust. " +
      "For your first 20 years the Guild protects you from attack. After that, the neighbors will come.")) + "\n\n");
    while (true) {
      await out("|07 Name your realm |08(blank to leave)|07: ");
      const name = (await readLine({ max: 24 })).trim();
      if (!name) return false;
      const ok = await oops(() => act$("create", { name }));
      if (ok) { await out("\n|10 Long live " + esc(name) + "!|07\n"); await sleep(1000); return true; }
    }
  }

  function header() {
    return "|12 BARREN DRAINS ELITE |08* |15" + esc(R.name) + " |08ruled by |14" + esc(R.handle) + "\n" + rule(4, "=") +
      "|07 Year |15" + R.years + "   |07Turns |15" + R.turns + "   |07Gold |14" + n(R.gold) + "   |07Food |10" + n(R.food) +
      "   |07Peasants |15" + n(R.peasants) + "\n" +
      "|07 Land |15" + n(R.land) + " |08(" + n(R.free) + " open)   |07Army |15" + n(R.army) + " |08(beds for " + n(R.housing) + ")" +
      "   |07Worth |15" + n(R.networth) + "\n" +
      (R.protected ? "|03 Under the Plumbers' Guild's protection for " + R.protectLeft + " more year" + (R.protectLeft === 1 ? "" : "s") + ".\n" : "");
  }

  async function menu() {
    while (true) {
      cls();
      const row = (k1, a, cost, k2, b) => "|07   {" + k1 + "} " + pad(a, 23) + "|08" + pad(cost, 9) + "|07{" + k2 + "} " + b + "\n";
      await out(header() + "\n" +
        row("Y", "Rule another year", "1 turn", "B", "Build on open land") +
        row("E", "Explore for land", "1 turn", "R", "Recruit or disband troops") +
        row("A", "Attack a realm", "1 turn", "M", "Marketplace |08(food)") +
        row("X", "Sabotage", "1 turn", "T", "Tax rate |08(" + R.tax + "%)") +
        row("S", "Send a Sniffer", R.spiesLeft + " left", "P", "Pacts") +
        row("L", "The royal ledger", "", "N", "Daily news") +
        row("K", "Rankings of the realms", "", "Q", "Back to the board") +
        "\n|08Your command, sire? |07");
      const k = await readKey("YEAXSBRMTPLNKQ");
      if (k === "Q") return;
      if (k === "Y") await year("rest");
      if (k === "E") await year("explore");
      if (k === "B") await build();
      if (k === "R") await recruit();
      if (k === "M") await market();
      if (k === "T") await tax();
      if (k === "A") await attack();
      if (k === "S") await spy();
      if (k === "X") await sabotage();
      if (k === "P") await pacts();
      if (k === "L") await ledger();
      if (k === "N") await newsScreen();
      if (k === "K") await rankings();
    }
  }

  async function year(mode) {
    const r = await oops(() => act$("year", { mode }));
    if (!r) return;
    const y = r.year;
    cls();
    const L = (a, b) => "  " + pad(a, 38) + b + "\n";
    const num = (label, v, unit) => pad(label, 18) + lpad((v < 0 ? "-" : "") + n(Math.abs(v)), 9) + (unit ? " " + unit : "");
    await out("|14 ======== The Report for the Year " + y.year + " in " + esc(R.name) + " " + "=".repeat(Math.max(3, 40 - String(y.year).length - R.name.length)) + "\n\n");
    await out("|07" + L(num("Harvest", y.harvest, "bushels"), num("Taxes", y.taxes, "gold")));
    await out("|07" + L(num("Eaten", -y.eaten, ""), num("Outhouse fees", y.outhouse, "")));
    await out("|07" + L(num("Net food", y.harvest - y.eaten, ""), num("Army upkeep", -y.upkeep, "")));
    const ch = (label, v, plus) => "|07" + label + " " + (!v ? "|080" : (plus ? "|10+" : "|12-") + n(v)) + "   ";
    await out("\n  " + ch("Born", y.born, true) + ch("Moved away", y.left) + ch("Starved", y.starved) + ch("Deserted", y.deserted) + "\n");
    if (y.explored !== undefined) await out("\n|11  Your explorers waded out and claimed " + n(y.explored) + " acres for " + n(y.exploreCost) + " gold.\n");
    if (y.starved) await out("|12  The granaries ran dry. People starved and soldiers deserted.\n");
    if (y.unpaid) await out("|12  The treasury ran dry. Unpaid troops went home.\n");
    if (y.event) await out("\n|13  " + esc(y.event) + "\n");
    if (R.peasants >= R.capacity - 5) await out("|08  Your land is full. Peasants need more acres to grow.\n");

    await anyKey();
  }

  async function build() {
    while (true) {
      cls();
      await out(header() + "\n|14 Build on open land |08(" + n(R.free) + " acres open, " + n(R.gold) + " gold)\n\n");

      await out("\n|07   {Q} Done\n\n|08Build what? |07");
      const k = await readKey("FOBTPQ");
      if (k === "Q") return;
      const [, key, name] = BUILD.find(b => b[0] === k);
      const max = Math.min(R.free, Math.floor(R.gold / COST[key]));
      const amt = await ask("\n|07How many " + name + "? |08(up to " + n(max) + ", M for max) |07", max);
      if (!amt) continue;
      const r = await oops(() => act$("build", { kind: key, n: amt }));
      if (r) await tell(r.msg);
    }
  }

  async function recruit() {
    while (true) {
      cls();
      await out(header() + "\n|14 The barracks |08(" + n(R.gold) + " gold, " + n(R.peasants) + " peasants to draw from)\n\n");
      for (const [k, key, name, cost, what] of UNITS)
        await out("|07   {" + k + "} |15" + pad(name, 14) + "|07" + lpad(n(R[key]), 7) + "  |14" + lpad(n(cost), 4) + "g  |08" + what + "\n");
      await out("\n|07   {Q} Done\n\n|08Which troops? |07");
      const k = await readKey("PSWNQ");
      if (k === "Q") return;
      const [, key, name, cost] = UNITS.find(u => u[0] === k);
      await out("\n|07{R} Recruit " + name + "  {D} Disband them  {Q} Never mind |07");
      const op = await readKey("RDQ");
      if (op === "Q") continue;
      if (op === "R") {
        const crew = key === "wagons" ? 3 : 1;
        const max = Math.max(0, Math.min(Math.floor(R.gold / cost), Math.floor((R.peasants - 100) / crew)));
        const amt = await ask("\n|07Recruit how many? |08(up to " + n(max) + ", M for max) |07", max);
        if (!amt) continue;
        const r = await oops(() => act$("recruit", { kind: key, n: amt }));
        if (r) await tell(r.msg);
      } else {
        const amt = await ask("\n|07Send how many home? |08(up to " + n(R[key]) + ") |07", R[key]);
        if (!amt) continue;
        const r = await oops(() => act$("disband", { kind: key, n: amt }));
        if (r) await tell(r.msg);
      }
    }
  }

  async function market() {
    while (true) {
      cls();
      const eat = R.peasants + R.army + R.sniffers;
      await out(header() + "\n|14 The Marketplace\n\n" +
        "|07 Food in the granary: |10" + n(R.food) + " bushels  |08(your realm eats about " + n(eat) + " a year)\n" +
        "|07 Merchants sell food at |143 gold|07 a bushel and buy it at |141 gold|07. They are not your friends.\n\n" +
        "|07   {B} Buy food   {S} Sell food   {Q} Done\n\n|08Well? |07");
      const k = await readKey("BSQ");
      if (k === "Q") return;
      const max = k === "B" ? Math.floor(R.gold / 3) : R.food;
      const amt = await ask("\n|07How many bushels? |08(up to " + n(max) + ", M for max) |07", max);
      if (!amt) continue;
      const r = await oops(() => act$("market", { op: k === "B" ? "buy" : "sell", n: amt }));
      if (r) await tell(r.msg);

    await out(header() + "\n|14 The Tax Collector\n\n" + say(wrap(

  async function pickRealm(title, filter) {
    const list = await oops(() => api("door/barren/realms"));
    if (!list) return null;
    const rows = list.realms.filter(x => x.id !== list.me).filter(filter || (() => true));
    cls();
    await out("|14 " + title + "\n" + rule(6));

  async function attack() {
    if (R.turns < 1) { await out("\n|12 You're out of turns for today.|07\n"); return anyKey(); }
    const v = await pickRealm("Attack which realm?", x => !x.ally);

    const k = await readKey("1234Q");
    if (k === "Q") return;
    const r = await oops(() => act$("attack", { target: v.id, pct: [25, 50, 75, 100][+k - 1] }));
    if (!r) return;
    const b = r.battle;
    cls();
    await out("|12 War with " + esc(b.target) + "\n" + rule(4, "=") + "\n");
    const sent = [b.sent.plungers && n(b.sent.plungers) + " Plungermen", b.sent.slingers && n(b.sent.slingers) + " Slingers", b.sent.wagons && n(b.sent.wagons) + " Honey Wagons"].filter(Boolean).join(", ");
    await out("|07 You march " + sent + " across the border.\n"); await sleep(700);
    await out("|08 The stench of battle rises over the leach fields"); for (let i = 0; i < 5; i++) { await sleep(350); await out("."); }
    await out("\n\n|07 Your attack strength |15" + n(b.off) + "|07 against their defenses |15" + n(b.def) + "\n\n");

    }

  };
