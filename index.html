<style>
/* Layout: one-screen DOS terminal — CRT in a plastic bezel, Telix-style status bar beneath */
:root {
  color-scheme: dark;
  --desk: #15130f;
  --bezel: #2b2620;
  --bezel-hi: #3a342b;
  --screen: #040404;
  --ink: #aaaaaa;
  --dim: #6f685c;
  --bar: #0000aa;
  --bar-ink: #ffffff;
  --bar-hi: #ffff55;
  --term: "VT323", "Courier New", monospace;
  --c0:#000000; --c1:#0000aa; --c2:#00aa00; --c3:#00aaaa; --c4:#aa0000; --c5:#aa00aa; --c6:#aa5500; --c7:#aaaaaa;
  --c8:#555555; --c9:#5555ff; --c10:#55ff55; --c11:#55ffff; --c12:#ff5555; --c13:#ff55ff; --c14:#ffff55; --c15:#ffffff;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--desk);
  color: var(--ink);
  font-family: var(--term);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  display: flex;
}
#app { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; max-width: 1180px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; gap: 12px; color: var(--dim); font-size: 18px; letter-spacing: .06em; text-transform: uppercase; }
.top b { color: #c9bfa9; font-weight: normal; }
#bezel {
  flex: 1; min-height: 0; display: flex; padding: 14px; border-radius: 18px;
  background: linear-gradient(180deg, var(--bezel-hi), var(--bezel));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.5);
}
#crt {
  position: relative; flex: 1; min-width: 0; min-height: 0; border-radius: 12px; overflow: hidden;
  background: radial-gradient(ellipse at center, #0b0b0b 0%, var(--screen) 75%);
  box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 2px rgba(255,255,255,.15);
  cursor: text;
}
#scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 12px; scrollbar-width: thin; scrollbar-color: #333 transparent; }
#scr {
  margin: 0 auto; width: max-content; max-width: 100%;
  font-family: var(--term); font-size: 20px; line-height: 1.05;
  white-space: pre; color: var(--c7);
  text-shadow: 0 0 2px rgba(255,255,255,.18), 0 0 6px rgba(120,160,255,.08);
}
#crt::after {
  content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 12px;
  background: repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
}
.f0{color:var(--c0)}.f1{color:var(--c1)}.f2{color:var(--c2)}.f3{color:var(--c3)}.f4{color:var(--c4)}.f5{color:var(--c5)}.f6{color:var(--c6)}.f7{color:var(--c7)}
.f8{color:var(--c8)}.f9{color:var(--c9)}.f10{color:var(--c10)}.f11{color:var(--c11)}.f12{color:var(--c12)}.f13{color:var(--c13)}.f14{color:var(--c14)}.f15{color:var(--c15)}
.b1{background:var(--c1)}.b2{background:var(--c2)}.b3{background:var(--c3)}.b4{background:var(--c4)}.b5{background:var(--c5)}.b6{background:var(--c6)}.b7{background:var(--c7)}
.hk { cursor: pointer; border-radius: 2px; }
.hk .k { color: var(--c14); }
.hk .br { color: var(--c8); }
.hk:not(.stale):hover, .hk:not(.stale):focus-visible { background: var(--c1); outline: none; }
.hk:not(.stale):hover .k { color: var(--c15); }
.hk.stale { cursor: inherit; }
.hk.stale .k { color: inherit; }
.cur { display: inline-block; width: 1ch; color: var(--c7); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
#kbd { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
#bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 0 14px; padding: 2px 10px;
  background: var(--bar); color: var(--bar-ink); font-size: 19px; line-height: 1.3;
}
#bar .sep { color: #5555ff; }
#bar .hi { color: var(--bar-hi); }
#bar .grow { flex: 1; }
#bar button {
  font: inherit; color: var(--bar-ink); background: #000080; border: 0; padding: 0 8px; cursor: pointer;
  box-shadow: inset 1px 1px 0 #5555ff, inset -1px -1px 0 #000040;
}
#bar button:hover, #bar button:focus-visible { background: #00aaaa; color: #000; outline: none; }
#bar .on { color: var(--bar-hi); }
@media (max-width: 560px) {
  body { padding-block: 6px; }
  #bezel { padding: 6px; border-radius: 12px; }
  #scroll { padding: 6px; }
  .top { font-size: 15px; }
  #bar { font-size: 16px; gap: 0 8px; }
  .wide { display: none; }
}
#keys { display: none; gap: 6px; flex-wrap: wrap; }
@media (pointer: coarse), (max-width: 700px) { #keys:not([hidden]) { display: flex; } }
#keys button {
  font: inherit; font-size: 19px; color: var(--c15); background: #1d1a15; border: 1px solid #4a4235; border-radius: 4px;
  padding: 6px 10px; min-height: 40px; cursor: pointer; flex: 1 1 auto; text-align: left;
}
#keys button b { color: var(--c14); font-weight: normal; margin-right: 6px; }
#keys button:active, #keys button:focus-visible { background: var(--c1); outline: none; }
@media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
</style>

<div id="app">
  <div class="top"><span><b>SEPTIC.FON</b> &middot; DOS terminal</span><span>tap a [key] or type</span></div>

<script>
"use strict";
// The Septic Tankz — terminal client. Talks to the board server at API.

// ---------------------------------------------------------------- config
const API = (((document.querySelector('meta[name="bbs-api"]') || {}).content) || "").replace(/^\/\*.*\*\/$/, "").replace(/\/$/, "");
const PHONE = "1-617-555-8265";
const CPS = 1440;                 // 14.4k ≈ 1440 chars/sec
const IDLE_LIMIT_MIN = 5;
const ART = {"logo_main": ["|08       - = [ |14t h e|08 ] = -", "|15       _____ ___________ _____ _ _____   _____ ___   _   _  _   __ ______", "|11      /  ___|  ___| ___ \\_   _(_)  __ \\ |_   _/ _ \\ | \\ | || | / /|___  /", "|11      \\ `--.| |__ | |_/ / | |  _| /  \\/   | |/ /_\\ \\|  \\| || |/ /    / /", "|03       `--. \\  __||  __/  | | | | |       | ||  _  || . ` ||    \\   / /", "|03      /\\__/ / |___| |     | | | | \\__/\\   | || | | || |\\  || |\\  \\./ /___", "|01      \\____/\\____/\\_|     \\_/ |_|\\____/   \\_/\\_| |_/\\_| \\_/\\_| \\_/\\_____/"], "logo_elite": ["|13 @@@@@@@  @@@@@@@@   @@@@@@    @@@@@@   @@@@@@@    @@@@@@    @@@@@@   @@@", "|13@@@@@@@@  @@@@@@@@  @@@@@@@   @@@@@@@   @@@@@@@@  @@@@@@@@  @@@@@@@@  @@@", "|05!@@       @@!       !@@       !@@       @@!  @@@  @@!  @@@  @@!  @@@  @@!", "|05!@!       !@!       !@!       !@!       !@!  @!@  !@!  @!@  !@!  @!@  !@!", "|12!@!       @!!!:!    !!@@!!    !!@@!!    @!@@!@!   @!@  !@!  @!@  !@!  @!!", "|12!!!       !!!!!:     !!@!!!    !!@!!!   !!@!!!    !@!  !!!  !@!  !!!  !!!", "|04:!!       !!:            !:!       !:!  !!:       !!:  !!!  !!:  !!!  !!:", "|04:!:       :!:           !:!       !:!   :!:       :!:  !:!  :!:  !:!   :!:", "|08 ::: :::   :: ::::  :::: ::   :::: ::    ::       ::::: ::  ::::: ::   :: ::::", "|08 :: :: :  : :: ::   :: : :    :: : :     :         : :  :    : :  :   : :: : :"], "tank": ["|08 FROM HOUSE                                               TO LEACH FIELD", "|08 |07==========.|08      _[_]_                       _[_]_      |07.=============>", "|08           |07||08     |     |                     |     |     |07|", "|08  .--------|07||08-----'     '---------------------'     '-----|07||08---------.", "|08  |        |07||08  |06^^^^^^^^^^^^^^|08 |06S|08 |06C|08 |06U|08 |06M|08 |06^^^^^^^^^^^^^^^^^^|08  |07||08         |", "|08  |        |07'|08                                             |07'|08         |", "|08  |    |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08   |03E|08 |03F|08 |03F|08 |03L|08 |03U|08 |03E|08 |03N|08 |03T|08   |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08 |03~|08         |", "|08  |                                                                |", "|08  |  |06##########|08  |06S|08 |06L|08 |06U|08 |06D|08 |06G|08 |06E|08  |06###############################|08      |", "|08  '----------------------------------------------------------------'"], "toilet": ["|07              ____________", "|07             |  |15SEPTIC|07    |      |08Thanks for calling", "|07             |__|15TANKZ|07____|      |15THE SEPTIC TANKZ", "|07               |      |", "|07          .----'------'----.        |08Remember: only flush", "|07         (                  )       |08what you've uploaded.", "|07          '.              .'", "|07            '----.  .----'          |11Call back soon.", "|07                 |  |", "|07               __|__|__"]};

// ---------------------------------------------------------------- dom
const $ = id => document.getElementById(id);
const scr = $("scr"), scroll = $("scroll"), crt = $("crt"), kbd = $("kbd"), picker = $("picker");
const stMode = $("st-mode"), stNode = $("st-node"), stTime = $("st-time"), stUser = $("st-user");
const bSnd = $("b-snd"), bHang = $("b-hang"), keysEl = $("keys");
const live = document.createElement("span");
scr.appendChild(live);

// ---------------------------------------------------------------- fit 80 columns
let charRatio = 0.5;
function measure() {
  const p = document.createElement("span");
  p.style.cssText = "position:absolute;visibility:hidden;white-space:pre;font-size:100px;font-family:" + getComputedStyle(scr).fontFamily;
  p.textContent = "M".repeat(80);
  document.body.appendChild(p);
  charRatio = p.getBoundingClientRect().width / 100;
  p.remove();
}
function fit() {
  const w = scroll.clientWidth - 2 * parseFloat(getComputedStyle(scroll).paddingLeft) - 2;
  scr.style.fontSize = Math.max(6, Math.min(26, w / charRatio)).toFixed(2) + "px";
}
measure(); fit();
if (document.fonts) document.fonts.load("20px VT323").then(() => { measure(); fit(); }).catch(() => {});
new ResizeObserver(fit).observe(scroll);

// ---------------------------------------------------------------- abortable session plumbing
class Hangup extends Error {}
class BoardError extends Error {}
const pending = new Set();
function track(executor) {
  return new Promise((res, rej) => {
    const entry = { rej };
    pending.add(entry);
    executor(v => { pending.delete(entry); res(v); }, e => { pending.delete(entry); rej(e); }, entry);
  });
}
function sleep(ms) {
  return track((res, rej, entry) => { const t = setTimeout(res, ms); entry.cancel = () => clearTimeout(t); });
}

// ---------------------------------------------------------------- terminal output
let Q = [], drainers = [], running = false, fast = false, lastT = 0;
let curNode = null, curCls = "", gen = 0, fg = 7, bg = 0;

function parse(str) {
  const ops = [];
  let buf = "";
  const flush = () => { if (buf) { ops.push({ text: buf, fg, bg }); buf = ""; } };
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (ch === "|" && /\d\d/.test(str.substr(i + 1, 2))) {
      flush();
      const n = +str.substr(i + 1, 2);
      if (n < 16) fg = n; else if (n < 24) bg = n - 16;
      i += 2; continue;
    }
    if (ch === "{" && str[i + 2] === "}" && str[i + 1] !== undefined) {
      flush(); ops.push({ hk: str[i + 1].toUpperCase(), fg, bg }); i += 2; continue;
    }
    buf += ch;
  }
  flush();
  return ops;
}
function cls() { Q.push({ cls: true }); }
function kick() { if (!running) { running = true; lastT = performance.now(); requestAnimationFrame(step); } }
function out(str) {
  Q.push(...parse(str));
  kick();
  return track((res, rej, entry) => drainers.push({ res, entry }));
}
function outNow(str) { for (const op of parse(str)) appendOp(op); scrollDown(); }
function appendText(text, f, b) {
  const c = "f" + f + (b ? " b" + b : "");
  if (curNode && curCls === c && curNode.parentNode && curNode.parentNode.nextSibling === live) {
    curNode.appendData(text);
  } else {
    const s = document.createElement("span");
    s.className = c;
    curNode = document.createTextNode(text);
    s.appendChild(curNode);
    scr.insertBefore(s, live);
    curCls = c;
  }
}
function appendOp(op) {
  if (op.cls) { while (scr.firstChild !== live) scr.removeChild(scr.firstChild); curNode = null; return 0; }
  if (op.el) { scr.insertBefore(op.el, live); curNode = null; return 1; }
  if (op.hk) {
    const s = document.createElement("span");
    s.className = "hk"; s.dataset.k = op.hk; s.dataset.g = gen; s.setAttribute("role", "button");
    s.innerHTML = '<span class="br">[</span><span class="k"></span><span class="br">]</span>';
    s.querySelector(".k").textContent = op.hk;
    scr.insertBefore(s, live); curNode = null;
    return 3;
  }
  appendText(op.text, op.fg, op.bg);
  return op.text.length;
}
function step(t) {
  let budget = fast ? 1e9 : Math.max(1, Math.round((t - lastT) / 1000 * CPS));
  lastT = t;
  while (budget > 0 && Q.length) {
    const op = Q[0];
    if (op.text !== undefined && op.text.length > budget) {
      appendText(op.text.slice(0, budget), op.fg, op.bg);
      op.text = op.text.slice(budget); budget = 0;
    } else { budget -= appendOp(op); Q.shift(); }
  }
  while (scr.childNodes.length > 4000) scr.removeChild(scr.firstChild);
  scrollDown();
  if (Q.length) requestAnimationFrame(step);
  else {
    running = false; fast = false;
    const d = drainers; drainers = [];
    d.forEach(x => { pending.delete(x.entry); x.res(); });
    if (want) Promise.resolve().then(drainTypeahead);
  }
}
function scrollDown() { scroll.scrollTop = scroll.scrollHeight; }
function outEl(cssClass) {
  const s = document.createElement("span"); s.className = cssClass || "f7";
  Q.push({ el: s }); kick();
  return track((res, rej, entry) => drainers.push({ res: () => res(s), entry })).then(() => s);
}

// ---------------------------------------------------------------- input
let want = null, lastInput = Date.now();
function renderLive() {
  live.textContent = "";
  if (want && want.type === "line") {
    const t = document.createElement("span"); t.className = "f15";
    t.textContent = want.mask ? "*".repeat(want.buf.length) : want.buf;
    live.appendChild(t);
  }
  const c = document.createElement("span"); c.className = "cur"; c.textContent = "_";
  live.appendChild(c);
  scrollDown();
  updateKeys();
}
function updateKeys() {
  keysEl.textContent = "";
  const add = (k, label, fn) => {
    const b = document.createElement("button"); b.type = "button";
    if (k) { const kb = document.createElement("b"); kb.textContent = k; b.appendChild(kb); }
    b.appendChild(document.createTextNode(label));
    b.addEventListener("click", fn); keysEl.appendChild(b);
  };
  if (want && want.type === "line") { add("", "Tap to type", () => kbd.focus()); add("", "ENTER", () => feed("\r")); }
  else if (want && !want.keys) add("", "Continue", () => feed(" "));
  else if (want) {
    const seen = new Set();
    scr.querySelectorAll(".hk:not(.stale)").forEach(h => {
      const k = h.dataset.k;
      if (+h.dataset.g !== gen || seen.has(k) || !want.keys.has(k)) return;
      seen.add(k);
      let txt = "", n = h.nextSibling;
      while (n && n !== live && !(n.classList && n.classList.contains("hk")) && txt.length < 60) { txt += n.textContent; n = n.nextSibling; }
      const label = (txt.split(/\s{2,}|\n/).map(x => x.trim()).filter(Boolean)[0] || "").slice(0, 24);
      add(k, label, () => feed(k));
    });
  }
  keysEl.hidden = !keysEl.children.length;
}
renderLive();
function staleHotkeys() { gen++; scr.querySelectorAll(".hk:not(.stale)").forEach(h => h.classList.add("stale")); }
function readKey(keys, opts = {}) {
  return track((res, rej, entry) => {
    want = { type: "key", keys: keys ? new Set(keys.toUpperCase().split("")) : null, enter: opts.enter, sync: opts.sync, res: k => { staleHotkeys(); res(k); }, entry };
    renderLive();
    drainTypeahead();
  });
}
function anyKey(msg) {
  return out(msg || "\n|08[|07press any key|08]").then(() => readKey(null)).then(() => outNow("\n"));
}
function readLine(opts = {}) {
  return track((res, rej, entry) => {
    want = { type: "line", buf: opts.value || "", max: opts.max || 40, mask: !!opts.mask, upper: !!opts.upper, res, entry };
    renderLive();
    if (!matchMedia("(pointer: coarse)").matches) kbd.focus({ preventScroll: true });
    drainTypeahead();
  });
}
// Keys typed while text is still scrolling (or the board is thinking) are kept, like a real typeahead buffer.
let typeahead = [];
function drainTypeahead() { while (typeahead.length && want && !running) feed(typeahead.shift(), true); }
function feed(ch, fromBuffer) {
  if (!fromBuffer) { lastInput = Date.now(); A.ensure(); }
  if (running || !want) {
    if (running) fast = true;
    if (!fromBuffer && typeahead.length < 64) typeahead.push(ch);
    return;
  }
  const w = want;
  if (w.type === "key") {
    const k = ch === "\r" ? "\r" : ch.toUpperCase();
    if (!w.keys || w.keys.has(k) || (k === "\r" && w.enter)) {
      const final = k === "\r" && w.enter ? w.enter : k;
      // Some keys must act inside the keypress itself (browsers only open a file picker from a real gesture).
      if (w.sync && w.sync[final]) { if (fromBuffer) return; w.sync[final](); }
      want = null; renderLive(); w.res(final);
    }
    return;
  }
  if (ch === "\r") { want = null; outNow("|15" + (w.mask ? "*".repeat(w.buf.length) : esc(w.buf)) + "|07\n"); renderLive(); w.res(w.buf); return; }
  if (ch === "\b") { w.buf = w.buf.slice(0, -1); renderLive(); return; }
  if (ch === "\x1b") return;
  if (ch.length === 1 && ch >= " " && w.buf.length < w.max) { w.buf += w.upper ? ch.toUpperCase() : ch; renderLive(); }
}
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target && e.target.tagName === "BUTTON" && (e.key === "Enter" || e.key === " ")) return;
  if (e.key === "Enter") { e.preventDefault(); feed("\r"); }
  else if (e.key === "Backspace") { e.preventDefault(); feed("\b"); }
  else if (e.key === "Escape") { feed("\x1b"); }
  else if (e.key && e.key.length === 1) { e.preventDefault(); feed(e.key); }
});
kbd.addEventListener("input", () => { const v = kbd.value; kbd.value = ""; for (const ch of v) feed(ch); });
crt.addEventListener("click", e => {
  const hk = e.target.closest(".hk");
  if (hk && !hk.classList.contains("stale") && +hk.dataset.g === gen) { feed(hk.dataset.k); return; }
  if (want && want.type === "key" && !want.keys) { feed(" "); return; }
  if (running) fast = true;
  kbd.focus({ preventScroll: true });
});

// Text helpers. esc(): plain text, no colors. uc(): user text, pipe colors |00-|15 allowed.
function esc(s) { return String(s ?? "").replace(/\|/g, "!").replace(/[{}]/g, "").replace(/[\x00-\x09\x0b-\x1f]/g, ""); }
function uc(s) { return String(s ?? "").replace(/\|(?!(0\d|1[0-5]))/g, "!").replace(/[{}]/g, "").replace(/[\x00-\x09\x0b-\x1f]/g, "") + "|07"; }
function pad(s, n) { s = String(s); return s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length); }
function lpad(s, n) { s = String(s); return s.length >= n ? s : " ".repeat(n - s.length) + s; }
function K(bytes) { return Math.ceil((bytes || 0) / 1024).toLocaleString("en-US") + "K"; }
function d8(ms) { if (!ms) return "--/--/--"; const d = new Date(ms); return String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0") + "/" + String(d.getFullYear()).slice(-2); }
function hm(ms) { const d = new Date(ms); let h = d.getHours(); const ap = h >= 12 ? "pm" : "am"; h = h % 12 || 12; return h + ":" + String(d.getMinutes()).padStart(2, "0") + ap; }
function wrap(s, n = 76) {
  return String(s).split("\n").map(par => {
    const words = par.split(" "), lines = []; let l = "";
    for (const w of words) { if ((l + " " + w).trim().length > n && l) { lines.push(l); l = w; } else l = l ? l + " " + w : w; }
    lines.push(l); return lines.join("\n");
  }).join("\n");
}
function rule(c, ch, n) { return "|" + String(c).padStart(2, "0") + (ch || "-").repeat(n || 78) + "|07\n"; }
async function art(name) { await out(ART[name].join("\n") + "\n|07"); }

// ---------------------------------------------------------------- audio (modem noises)
const A = {
  ctx: null, master: null, on: true,
  ensure() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.master = this.ctx.createGain(); this.master.gain.value = 0.12; this.master.connect(this.ctx.destination);
      } catch (e) { this.ctx = null; }
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
  },
  ready() { return this.on && this.ctx && this.ctx.state === "running"; },
  cut() { if (this.ctx && this.master) { this.master.disconnect(); this.master = this.ctx.createGain(); this.master.gain.value = 0.12; this.master.connect(this.ctx.destination); } },
  tone(freqs, at, dur, vol = 0.5) {
    const c = this.ctx, t = c.currentTime + at, g = c.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
    g.gain.setValueAtTime(vol, t + dur - 0.015); g.gain.linearRampToValueAtTime(0, t + dur);
    g.connect(this.master);
    freqs.forEach(f => { const o = c.createOscillator(); o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + dur + 0.05); });
  },
  noise(at, dur, freq, q, vol) {
    const c = this.ctx, t = c.currentTime + at, len = Math.ceil(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.setValueAtTime(vol, t + dur - 0.05); g.gain.linearRampToValueAtTime(0, t + dur);
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t); s.stop(t + dur + 0.05);
  },
  async play(fn, dur) { if (this.ready()) fn(); await sleep(dur * 1000); },
  dialTone() { return this.play(() => this.tone([350, 440], 0, 0.7, 0.35), 0.75); },
  dtmf(num) {
    const R = [697, 770, 852, 941], C = [1209, 1336, 1477];
    const map = { 1: [0, 0], 2: [0, 1], 3: [0, 2], 4: [1, 0], 5: [1, 1], 6: [1, 2], 7: [2, 0], 8: [2, 1], 9: [2, 2], 0: [3, 1] };
    const digits = num.replace(/\D/g, "").split("");
    return this.play(() => digits.forEach((d, i) => this.tone([R[map[d][0]], C[map[d][1]]], i * 0.14, 0.08, 0.4)), digits.length * 0.14 + 0.2);
  },
  ring() { return this.play(() => this.tone([440, 480], 0, 1.1, 0.3), 2.1); },
  busy() { return this.play(() => { for (let i = 0; i < 4; i++) this.tone([480, 620], i, 0.5, 0.3); }, 4); },
  handshake() {
    return this.play(() => {
      this.tone([2100], 0, 1.0, 0.35);
      this.tone([1375, 2002], 1.1, 0.35, 0.3);
      this.tone([980], 1.5, 0.12, 0.3); this.tone([1650], 1.65, 0.12, 0.3); this.tone([980], 1.8, 0.12, 0.3);
      this.tone([2250, 1200], 2.0, 0.45, 0.28);
      this.noise(2.5, 1.4, 1800, 0.7, 0.9);
      this.noise(2.6, 1.2, 600, 1.5, 0.5);
    }, 4.0);
  },
};
try { if (localStorage.getItem("tankz-snd") === "off") A.on = false; } catch (e) {}
function paintSnd() { bSnd.innerHTML = 'SND <span class="on">' + (A.on ? "ON" : "OFF") + "</span>"; }

});

// ---------------------------------------------------------------- the board connection
let token = null, myNode = 0, LINES = 1, TIME_MIN = 60, INFO = null;
let state = "offline", onlineAt = 0;
let S = null;             // session: { user, eliteOk, unread }
let curAct = "Logging in", sentAct = "";

function rawFetch(path, opts) {
  return track((res, rej, entry) => {
    const ctl = new AbortController();
    entry.cancel = () => ctl.abort();
    fetch(API + "/api/" + path, { method: "POST", signal: ctl.signal, ...opts }).then(res, rej);
  });
}
async function api(path, body) {
  let r, data;
  try {
    r = await rawFetch(path, { headers: { "content-type": "application/json", ...(token ? { "x-line": token } : {}) }, body: JSON.stringify(body || {}) });
  } catch (e) {
    if (e instanceof Hangup) throw e;
    throw new BoardError("Line noise. The board didn't answer.");
  }
  try { data = await r.json(); } catch (e) { throw new BoardError("Garbled response from the board (" + r.status + ")."); }
  if (data.carrier === false) { dropCarrier(data.error && data.error !== "NO CARRIER" ? "|12*** " + esc(data.error) : null); throw new Hangup(); }
  if (!r.ok) throw new BoardError(data.error || "The board said no (" + r.status + ").");
  return data;
}
function act(s) { curAct = s; beat(); }
let lastBeat = 0;
function beat(force) {
  if (state !== "online" || !token) return;
  if (!force && curAct === sentAct && Date.now() - lastBeat < 20000) return;
  sentAct = curAct; lastBeat = Date.now();
  const tk = token;
  fetch(API + "/api/beat", { method: "POST", headers: { "content-type": "application/json", "x-line": tk }, body: JSON.stringify({ act: curAct }) })
    .then(r => r.json()).then(d => { if (d.carrier === false && token === tk) dropCarrier("|12*** The board hung up on you."); }).catch(() => {});
}
async function guard(fn) {
  try { await fn(); }
  catch (e) {
    if (e instanceof BoardError) { await out("\n|12" + esc(e.message) + "|07\n"); await anyKey(); }
    else throw e;
  }
}

// ---------------------------------------------------------------- session control
let flowId = 0;
function run(fn) {
  const id = ++flowId;
  fn().catch(e => {
    if (e instanceof Hangup) return;
    console.error(e);
    if (id === flowId) dropCarrier("|12*** " + esc(e.message || "Line noise. Carrier lost."));
  });
}
function abortAll() {
  Q = []; running = false; fast = false; drainers = []; typeahead = [];
  want = null; renderLive();
  for (const p of [...pending]) { if (p.cancel) p.cancel(); p.rej(new Hangup()); }
  pending.clear();
  A.cut();
}
function setMode(m) {
  state = m;
  stMode.textContent = m === "online" ? "ONLINE" : m === "dialing" ? "DIALING" : "OFFLINE";
  bHang.hidden = m === "offline";
  if (m === "online") { onlineAt = Date.now(); lastInput = Date.now(); }
  stNode.textContent = m === "online" ? "NODE " + myNode : "NODE --";
  if (m !== "online") stUser.textContent = "ANSI-BBS";
}
function releaseLine() {
  if (!token) return;
  const tk = token; token = null;
  try { fetch(API + "/api/hangup", { method: "POST", keepalive: true, headers: { "x-line": tk } }).catch(() => {}); } catch (e) {}
}
function dropCarrier(msg) {
  if (state === "offline") return;
  abortAll(); releaseLine(); setMode("offline"); S = null;
  run(async () => {
    if (msg) outNow("\n" + msg + "\n");
    outNow("\n|15NO CARRIER\n");
    await sleep(900);
    await dialer();
  });
}
bHang.addEventListener("click", () => dropCarrier("|08+++ ATH0"));
setInterval(() => {
  if (state !== "online") { stTime.textContent = "00:00:00"; return; }
  const s = Math.floor((Date.now() - onlineAt) / 1000);
  stTime.textContent = [s / 3600, (s % 3600) / 60, s % 60].map(x => String(Math.floor(x)).padStart(2, "0")).join(":");
  if (s >= TIME_MIN * 60) dropCarrier("|12*** Your " + TIME_MIN + " minutes are up. Give somebody else a turn on the line.");
  else if (Date.now() - lastInput > IDLE_LIMIT_MIN * 60000 && !running) dropCarrier("|12*** Inactivity timeout. Don't hog the line.");
  else beat();
}, 1000);
function timeLeft() { return Math.max(0, TIME_MIN - Math.floor((Date.now() - onlineAt) / 60000)); }
window.addEventListener("pagehide", releaseLine);

async function dialer() {
  setMode("offline");
  while (true) {
    cls();
    await out(
      "|15 SEPTIC.FON |08- |07Dialing Directory                               |08v2.1\n" +
      "|09+----+---------------------------+------------------+--------+-------------+\n" +
      "|09||11 ## |09||11 " + pad("Name", 26) + "|09||11 " + pad("Number", 17) + "|09||11 " + pad("Baud", 7) + "|09||11 " + pad("Protocol", 12) + "|09|\n" +
      "|09+----+---------------------------+------------------+--------+-------------+\n" +
      "|09||15  1 |09||14 " + pad("The Septic Tankz", 26) + "|09||07 " + pad(PHONE, 17) + "|09||07 14400  |09||07 Zmodem      |09|\n" +
      "|09||08  2 |09||08 " + pad("The Grease Trap", 26) + "|09||08 " + pad("[unlisted]", 17) + "|09||08 2400   |09||08 Xmodem      |09|\n" +
      "|09||08  3 |09||08 " + pad("Mom's House (voice!)", 26) + "|09||08 " + pad("do not dial", 17) + "|09||08 --     |09||08 --          |09|\n" +
      "|09+----+---------------------------+------------------+--------+-------------+\n\n" +
      "|07 The Septic Tankz is a real board with real phone lines. When they're all\n" +
      " in use you get a |12busy signal|07. Try again, or let auto-redial keep trying.\n\n" +
      "   {D} Dial The Septic Tankz    {A} Auto-redial until it connects    {?} About\n\n" +
      "|08 Command: |07"
    );
    const k = await readKey("DA?");
    if (k === "?") { await about(); continue; }
    if (k === "D") { if (await dial()) return board(); await anyKey("\n|08[|07press any key to return to the directory|08]"); continue; }
    if (k === "A") {
      for (let tries = 1; tries <= 12; tries++) {
        outNow("\n|08Auto-redial attempt " + tries + " of 12\n");
        if (await dial()) return board();
        if (state === "nodial") break;
        outNow("|08Waiting 20 seconds before the next try. Any key cancels.\n");
        const keyP = readKey(null); keyP.catch(() => {});
        const r = await Promise.race([sleep(20000).then(() => null), keyP]);
        if (r) break;
        want = null; renderLive();
      }
      continue;
    }
  }
}

async function dial() {
  setMode("dialing");
  outNow("\n");
  await out("|07ATZ\n"); await sleep(250);
  await out("|15OK\n"); await sleep(300);
  await out("|07ATDT" + PHONE + "\n");
  await A.dialTone();
  await A.dtmf(PHONE);
  let result = null, failed = null, settled = false;
  rawFetch("dial", { headers: { "content-type": "application/json" }, body: "{}" })
    .then(r => r.json()).then(d => { result = d; }).catch(e => { failed = e; }).finally(() => { settled = true; });
  let rings = 0;
  while ((rings < 2 || !settled) && rings < 6) { await A.ring(); rings++; }
  if (!result || result.error) {
    await out("|12NO DIALTONE\n|08The board isn't answering. It may not be installed yet, or the line is down.\n");
    setMode("offline"); state = "nodial";
    return false;
  }
  if (result.busy) {
    await out("|12BUSY\n");
    await A.busy();
    setMode("offline");
    return false;
  }
  token = result.token; myNode = result.node; LINES = result.lines; TIME_MIN = result.timeMin;
  await A.handshake();
  await out("|15CONNECT 14400/ARQ/V32BIS/LAPM/V42BIS\n");
  setMode("online");
  await sleep(400);
  return true;
}

// CP437 for the upper half, so ANSI art from the era renders right.
const CP437 = "ÇüéâäàåçêëèïîìÄÅÉæÆôöòûùÿÖÜ¢£¥₧ƒáíóúñÑªº¿⌐¬½¼¡«»░▒▓│┤╡╢╖╕╣║╗╝╜╛┐└┴┬├─┼╞╟╚╔╩╦╠═╬╧╨╤╥╙╘╒╓╫╪┘┌█▄▌▐▀αßΓπΣσµτΦΘΩδ∞φε∩≡±≥≤⌠⌡÷≈°∙·√ⁿ²■ ";
function decodeBytes(b64) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try { return new TextDecoder("utf-8", { fatal: true }).decode(bytes); }
  catch (e) { let s = ""; for (const x of bytes) s += x < 128 ? String.fromCharCode(x) : CP437[x - 128]; return s; }
}
// Turn ANSI escape colors into pipe codes; drop everything else.
function ansiToPipes(text) {
  const map = [0, 4, 2, 6, 1, 5, 3, 7];
  let bold = false, f = 7, outS = "";
  const re = /\x1b\[([\d;]*)([A-Za-z])/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    outS += text.slice(last, m.index).replace(/\|/g, "!").replace(/[{}]/g, ch => ch === "{" ? "(" : ")");
    last = re.lastIndex;
    const params = m[1] ? m[1].split(";").map(Number) : [0];
    if (m[2] === "m") {
      for (const p of params) {
        if (p === 0) { bold = false; f = 7; }
        else if (p === 1) bold = true;
        else if (p >= 30 && p <= 37) f = map[p - 30];
        else if (p >= 40 && p <= 47) outS += "|" + String(16 + map[p - 40]);
      }
      if (params.includes(0)) outS += "|16";
      outS += "|" + String((bold ? 8 : 0) + f).padStart(2, "0");
    } else if (m[2] === "C") outS += " ".repeat(Math.min(80, params[0] || 1));
  }
  outS += text.slice(last).replace(/\|/g, "!").replace(/[{}]/g, ch => ch === "{" ? "(" : ")");
  return outS.replace(/\x1a[\s\S]*$/, "").replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g, "").replace(/\t/g, "    ");
}
async function viewFile(f) {
  act("Reading " + f.filename);
  const r = await api("view", { id: f.id });
  const text = ansiToPipes(decodeBytes(r.b64));
  const lines = [];
  for (const l of text.replace(/\r\n?/g, "\n").split("\n")) {
    let rest = l;
    do { lines.push(rest.slice(0, 80)); rest = rest.slice(80); } while (rest.length);
  }
  await pager("|15 " + f.filename + "\n" + rule(8), lines.map(l => "|07" + l + "|16"), 20);
}

function drawBar(bar, pr, size, cps) {
  const n = Math.round(pr * 40);
  bar.textContent = " [" + "#".repeat(n) + ".".repeat(40 - n) + "] " + lpad(Math.round(pr * 100), 3) + "%  " + cps.toLocaleString("en-US") + " cps  " + K(pr * size) + "\n";
  scrollDown();
}
// Resolves with the file the caller picks (or null). The picker itself is opened by the keypress.
function waitForPick() {
  picker.value = "";
  return track((res, rej, entry) => {
    const done = v => { picker.onchange = null; picker.oncancel = null; res(v); };
    picker.onchange = () => done(picker.files && picker.files[0] || null);
    picker.oncancel = () => done(null);
    entry.cancel = () => { picker.onchange = null; picker.oncancel = null; };
  });
}
async function uploadFile(area, side) {
  const elite = side === "elite";
  const ru = INFO ? INFO.rules : { mainRatio: 5, eliteRatio: 3, maxUpload: 52428800 };
  act("Uploading");
  cls();
  await out((elite ? "|13" : "|11") + " Upload to " + area.name + "\n" + rule(elite ? 5 : 3) +
    "|07 Max |15" + K(ru.maxUpload) + "|07 per file. Uploads wait for the SysOp to validate them.\n" +
    " Once approved you earn |15" + (elite ? ru.eliteRatio : ru.mainRatio) + "x|07 the file's size in " + (elite ? "Cesspool" : "download") + " credit.\n" +
    " |08Only upload things you have the right to share. No viruses.\n\n" +
    "|07Description (one line): |15");
  const descr = (await readLine({ max: 50 })).trim();
  if (!descr) return;
  await out("\n|07{S} Start upload (pick a file)   {Q} Cancel |15");
  const picked = waitForPick();
  picked.catch(() => {});
  if ((await readKey("SQ", { enter: "S", sync: { S: () => picker.click() } })) === "Q") { picker.onchange = picker.oncancel = null; return; }
  outNow("\n|08Waiting for your Zmodem upload... |07(any key cancels)\n");
  const cancelKey = readKey(null); cancelKey.catch(() => {});
  const file = await Promise.race([picked, cancelKey.then(() => null)]);
  if (want) { want = null; renderLive(); }
  if (!file) { await out("|12Upload cancelled.\n"); await sleep(600); return; }
  if (file.size > ru.maxUpload) { await out("|12Too big. The limit is " + K(ru.maxUpload) + ".\n"); return anyKey(); }
  await out("|11 Zmodem receive: |15" + esc(file.name) + "  |08(" + file.size.toLocaleString("en-US") + " bytes)\n");
  const bar = await outEl("f7");
  const t0 = Date.now();
  const result = await track((res, rej, entry) => {
    const xhr = new XMLHttpRequest();
    entry.cancel = () => xhr.abort();
    xhr.open("POST", API + "/api/upload");
    xhr.setRequestHeader("x-line", token);
    xhr.setRequestHeader("x-area", String(area.id));
    xhr.setRequestHeader("x-filename", encodeURIComponent(file.name));
    xhr.setRequestHeader("x-desc", encodeURIComponent(descr));
    xhr.setRequestHeader("content-type", "application/octet-stream");
    xhr.upload.onprogress = e => { if (e.lengthComputable) drawBar(bar, e.loaded / e.total, file.size, Math.round(e.loaded / Math.max(0.1, (Date.now() - t0) / 1000))); };
    xhr.onload = () => { let d; try { d = JSON.parse(xhr.responseText); } catch (e) { d = { error: "Garbled response (" + xhr.status + ")." }; } res({ status: xhr.status, d }); };
    xhr.onerror = () => res({ status: 0, d: { error: "Line noise. Transfer aborted." } });
    xhr.send(file);
  });
  if (result.d.carrier === false) { dropCarrier("|12*** " + esc(result.d.error || "NO CARRIER")); throw new Hangup(); }
  if (result.status !== 200) throw new BoardError(result.d.error || "Upload failed.");
  drawBar(bar, 1, file.size, Math.round(file.size / Math.max(0.1, (Date.now() - t0) / 1000)));
  if (result.d.pending)
    await out("|10 Got it: |15" + result.d.filename + "|10.|07 It's in the validation queue.\n" +
      " |08You'll get " + K(result.d.size * (elite ? ru.eliteRatio : ru.mainRatio)) + " of credit when the SysOp approves it. Thanks, d00d.\n");
  else await out("|10 Uploaded |15" + result.d.filename + "|10. SysOp uploads go live right away.\n");
  await anyKey();
}

const ROOMS = {
  bowl: { name: "Toilet Bowl", desc: "You are a rubber duck, bobbing in a toilet bowl. Somebody just leaned on the handle. The water is starting to swirl.", exits: { down: "pipe" } },
  pipe: { name: "Sewer Pipe", desc: "A four-inch cast iron pipe slopes away into the dark. It smells like 1958. Back up the way you came is too slippery.", exits: { east: "inlet" }, items: ["wrench"] },
  inlet: { name: "Inlet Tee", desc: "The pipe drops into a cavern. Below you is a big concrete tank. A tee fitting points straight down into it.", exits: { west: "pipe", down: "scum" } },
  scum: { name: "Scum Layer", desc: "You float on a crust of grease and mystery. A concrete baffle wall blocks the way east above the surface, but there's a gap down below.", exits: { up: "inlet", down: "effluent" } },
  effluent: { name: "Effluent Layer", desc: "Murky, but clearer than you'd hope. Light leaks from the gap under the baffle to the east. Below is darkness and something thick.", exits: { up: "scum", east: "outlet", down: "sludge" } },
  sludge: { name: "Sludge Layer", desc: "Thick, dark, ancient. Things settle here and are never seen again. Except, maybe, by you.", exits: { up: "effluent" }, items: ["ring"] },
  outlet: { name: "Outlet Tee", desc: "You're under the outlet tee. A pipe leads up and out toward the leach field. Daylight, somewhere.", exits: { west: "effluent", up: "field" } },
  field: { name: "Leach Field", desc: "You pop out of a distribution pipe into wet grass under a blue sky. A sprinkler ticks somewhere. You are free.", exits: {} },
};
const ITEMS = { wrench: "a heavy pipe wrench", ring: "a gold wedding ring" };
async function adventure() {
  act("Playing Escape the Tank");
  cls();
  await out("|14 E S C A P E   T H E   T A N K\n|08 a text adventure by ThE PLuMBeR - type HELP for commands\n" + rule(6));
  const roomItems = {}; for (const k in ROOMS) roomItems[k] = (ROOMS[k].items || []).slice();
  let here = "bowl", inv = [], moves = 0, score = 0;
  const look = async () => {
    const r = ROOMS[here];
    await out("\n|15" + r.name + "\n|07" + wrap(r.desc) + "\n");
    for (const it of roomItems[here]) await out("|07You see " + ITEMS[it] + " here.\n");
    const ex = Object.keys(r.exits);
    await out("|08Exits: " + (ex.length ? ex.join(", ") : "none") + "\n");
  };
  await look();
  while (true) {
    await out("\n|14> |15");
    const raw = (await readLine({ max: 40 })).trim().toLowerCase();
    if (!raw) continue;
    moves++;
    let [verb, ...rest] = raw.split(/\s+/); const noun = rest.join(" ").replace(/^(the|a|an) /, "");
    const dirs = { n: "north", s: "south", e: "east", w: "west", u: "up", d: "down" };
    if (dirs[verb]) verb = dirs[verb];
    if (verb === "go" && noun) verb = dirs[noun] || noun;
    if (["north", "south", "east", "west", "up", "down"].includes(verb)) {
      const heavy = inv.includes("wrench");
      if (here === "scum" && verb === "down" && !heavy) { await out("|07You dive. You're a rubber duck. You bob right back up.\n"); continue; }
      if (here === "outlet" && verb === "up" && heavy) { await out("|07You try to rise, but the wrench holds you down like an anchor.\n"); continue; }
      if (here === "scum" && verb === "east") { await out("|07The baffle wall is in the way up here.\n"); continue; }
      const to = ROOMS[here].exits[verb];
      if (!to) { await out("|07You can't go that way.\n"); continue; }
      here = to; await look();
      if (here === "field") {
        score += 50; if (inv.includes("ring")) score += 50;
        await out("\n|10*** You escaped the tank in " + moves + " moves. Score: " + score + " of 100. ***\n");
        if (!inv.includes("ring")) await out("|08Rumor has it something valuable sank to the bottom...\n");
        return anyKey();
      }
      continue;
    }
    if (verb === "look" || verb === "l") { await look(); continue; }
    if (verb === "inventory" || verb === "i" || verb === "inv") { await out("|07You carry: " + (inv.length ? inv.map(i => ITEMS[i]).join(", ") : "nothing. You're a duck.") + "\n"); continue; }
    if (verb === "take" || verb === "get") {
      const it = Object.keys(ITEMS).find(k => noun.includes(k));
      if (!it || !roomItems[here].includes(it)) { await out("|07You don't see that here.\n"); continue; }
      roomItems[here] = roomItems[here].filter(x => x !== it); inv.push(it);
      await out("|07Taken. " + (it === "wrench" ? "It's heavy. You ride a little lower in the water." : "Someone's going to be very happy. Or very embarrassed.") + "\n");
      continue;
    }
    if (verb === "drop") {
      const it = inv.find(k => noun.includes(k));
      if (!it) { await out("|07You don't have that.\n"); continue; }
      inv = inv.filter(x => x !== it); roomItems[here].push(it);
      await out("|07Dropped. " + (it === "wrench" ? "You feel buoyant again." : "") + "\n");
      continue;
    }
    if (verb === "help" || verb === "?") { await out("|07Commands: LOOK, N/S/E/W/UP/DOWN, TAKE <thing>, DROP <thing>, INVENTORY, QUIT\n"); continue; }
    if (verb === "quack") { await out("|07Quack. It echoes off the concrete.\n"); continue; }
    if (verb === "quit" || verb === "q") { await out("|07You give up and wait for the pump truck.\n"); await sleep(600); return; }
    await out("|07I don't know how to \"" + esc(verb) + "\".\n");
  }
}

async function sysopConsole() {

async function validateQueue() {
  const q = (await api("sysop/queue")).rows;
  for (let i = 0; i < q.length; i++) {
    const f = q[i];
    cls();

      "|07 Area ......... |15" + esc(f.area) + (f.side === "elite" ? " |13(Cesspool)" : "") + "\n" +
      "|07 Size ......... |15" + K(f.size) + "\n" +
      "|07 Uploader ..... |14" + esc(f.uploader) + "|07 on " + d8(f.uploaded_at) + " " + hm(f.uploaded_at) + "\n" +
      "|07 Description .. |15" + esc(f.descr) + "\n\n" +
      "|07{A} Approve  {F} Approve as FREE  {R} Reject & delete  {D} Download to check  {S} Skip  {Q} Quit |15");
    let k;
    while (true) {
      k = await readKey("AFRDSQ");
      if (k !== "D") break;
      const r = await api("sysop/fileget", { id: f.id });
      const a = document.createElement("a"); a.href = API + r.url; a.download = r.filename; document.body.appendChild(a); a.click(); a.remove();
      await out("\n|08Downloading for inspection... then choose: |07");
    }
    if (k === "Q") return;
    if (k === "S") continue;
    if (k === "R") { await api("sysop/validate", { id: f.id, action: "reject" }); await out("\n|12Flushed.\n"); }
    else {
      const r = await api("sysop/validate", { id: f.id, action: "approve", free: k === "F" });
      await out("\n|10Approved. |14" + esc(r.uploader) + "|10 earned " + K(r.credited) + " of credit.\n");
    }
    await sleep(600);
  }
  if (!q.length) { await out("\n|08Nothing waiting.\n"); await anyKey(); }
}

async function usersAdmin() {
  let page = 0;
  while (true) {
    const rows = (await api("sysop/users")).rows;
    const pages = Math.max(1, Math.ceil(rows.length / 9)); page = Math.min(page, pages - 1);
    const sl = rows.slice(page * 9, page * 9 + 9);
    cls();
    await out("|14 Users  |08page " + (page + 1) + " of " + pages + "\n" + rule(6) + "|08 #   Handle               Lvl  Flags  UL files  Main credit  Pool credit\n");
    for (let i = 0; i < sl.length; i++) {
      const u = sl[i];
      await out("|07 {" + (i + 1) + "} |14" + pad(esc(u.handle), 20) + " |07" + lpad(u.level, 3) + "  " + pad((u.elite ? "E" : "") + (u.banned ? "B" : "") + (u.sysop ? "S" : ""), 5) +
        lpad(u.ul_files, 9) + lpad(K(u.credit_main), 13) + lpad(K(u.credit_elite), 13) + "\n");
    }
    await out("\n|08 Flags: E elite, B banned, S sysop\n|07{N} Next  {P} Prev  {Q} Back |15");
    const k = await readKey("123456789".slice(0, sl.length) + "NPQ");
    if (k === "Q") return;
    if (k === "N") { page = (page + 1) % pages; continue; }
    if (k === "P") { page = (page + pages - 1) % pages; continue; }
    const u = sl[+k - 1];
    await out("\n\n|14" + esc(u.handle) + ": |07{E} " + (u.elite ? "Revoke" : "Grant") + " Cesspool  {B} " + (u.banned ? "Unban" : "Ban") +
      "  {C} Add main credit  {X} Add Cesspool credit  {Q} Back |15");
    const a = await readKey("EBCXQ");
    if (a === "E") await api("sysop/setuser", { id: u.id, elite: !u.elite });
    if (a === "B") await api("sysop/setuser", { id: u.id, banned: !u.banned });

      if (Number.isFinite(n)) await api("sysop/setuser", { id: u.id, [a === "C" ? "addMain" : "addElite"]: n * 1024 });
    }
  }
